<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机销量数据可视化</title>
<script>
  // Keep legacy home hash links working; module 5 is the default home.
  const routes = new Map([
    ['#sales-estimator', 'sales-estimator.html'],
    ['#sales-data-editor', 'sales-data-editor.html'],
    ['#sales-increment', 'sales-increment.html']
  ]);
  const destination = new URL(routes.get(location.hash) || 'sales-increment.html', location.href);
  destination.search = location.search;
  location.replace(destination);
</script>
</head>
<body>
<p>首页已迁移至<a href="sales-increment.html">销量增量追踪</a>。</p>
</body>
</html>
