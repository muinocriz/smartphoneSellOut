<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>销量追踪 · 市场份额</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="studio-ui.css">
<style>
/* Layout: 顶部标题 + 控制条（品牌 / 机型芯片 / 周期与显示选项）+ 全宽折线图 + 数据表 */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --fg:#1b2030; --muted:#636a7d; --line:#dfe2ea;
  --accent:#2f5bd3; --accent-soft:#e6ecfb; --warn:#b4541a;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --panel:#1a1e29; --fg:#e7e9ef; --muted:#9aa1b3; --line:#2c3242;
  --accent:#7f9cf0; --accent-soft:#25304d; --warn:#e89a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --panel:#1a1e29; --fg:#e7e9ef; --muted:#9aa1b3; --line:#2c3242;
  --accent:#7f9cf0; --accent-soft:#25304d; --warn:#e89a62; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:22px;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.hd-r{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.gh{font-size:13px;color:var(--accent);text-decoration:none;white-space:nowrap}
.gh:hover{text-decoration:underline}
.theme{font-size:15px;line-height:1;padding:3px 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.controls{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.disclaimer-input{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;flex:1 1 20em;min-width:0}
#exportDisclaimer{width:100%;min-width:0;box-sizing:border-box;resize:vertical;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;min-width:3.5em}
select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.brands{display:flex;flex-wrap:wrap;gap:6px}
.brands button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;user-select:none;font-size:13px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--sw);background:transparent}
.chip.on{background:var(--accent-soft);border-color:transparent}
.chip.on .dot{background:var(--sw)}
.chip.empty{opacity:.5}
.chip:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.chip small{color:var(--muted);font-family:var(--f-num);font-size:11px}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.mini{font-size:12px;padding:3px 8px}
.lists{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0;align-items:center}
.lists button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.lists .cnt{font-family:var(--f-num);font-size:11px;opacity:.7;margin-left:4px}
.lists button.ms{border-style:dashed}
.lists button.ms[disabled]{opacity:.5;cursor:default}
.lists .hint{font-size:12px;color:var(--muted)}
.editor{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--accent-soft)}
.editor input[type=text]{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:12em;max-width:100%}
.editor .dirty{font-size:12px;color:var(--warn)}
.editor .ok{font-size:12px;color:var(--muted)}
button.danger{color:var(--warn);border-color:var(--warn)}
button.danger.arm{background:var(--warn);color:#fff}
#chart{width:100%;height:480px}
.note{font-size:12px;color:var(--muted)}
.note b{color:var(--warn);font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.na{color:var(--muted)}
td.bad{color:var(--warn)}
.temp-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.temp-toolbar .note{flex:1;min-width:12em}
#tbl td[data-temp-week]{cursor:text}
#tbl td[data-temp-week]:hover{background:var(--accent-soft)}
#tbl td.temp-changed{color:var(--warn);box-shadow:inset 0 -2px var(--warn)}
#tbl .temp-input{width:7em;font:inherit;text-align:right;color:var(--fg);background:var(--panel);border:1px solid var(--accent);border-radius:4px;padding:3px}
#tbl .temp-undo{padding:2px 5px;margin-left:4px;color:var(--warn)}
@media (max-width:600px){#chart{height:400px}}
.chart-head{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-bottom:4px}
.chart-head .note{margin-right:2px}
.ico{font-size:16px;line-height:1;padding:4px 8px}
.ico[disabled]{opacity:.5;cursor:progress}
.rank{list-style:none;margin:6px 0 4px;padding:0;display:grid;grid-auto-flow:column;gap:2px 14px}
.rank li{display:flex;align-items:center;gap:5px;min-width:0;font-size:13px;padding:3px 4px;border-radius:6px;cursor:pointer}
.rank li.on{background:var(--accent-soft)}
.rank b{color:var(--c);font-weight:700;min-width:1.4em}
.rank i{flex:none;width:14px;height:3px;border-radius:2px;background:var(--c)}
.rank span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank em{font-style:normal;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.load{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.load.err{color:var(--warn)}

/* 首页四栏目：独立页面隔离样式、脚本与数据。 */
.page-tabs{font-family:var(--ui-font-body,var(--f-body));display:inline-flex;align-items:center;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.page-tabs button{font-size:17px;font-weight:700;white-space:nowrap;padding:6px 16px;border:0;border-radius:7px;background:transparent;color:var(--muted)}
.page-tabs button:hover{color:var(--fg);background:var(--accent-soft)}
.page-tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.sales-view{display:grid;gap:16px;min-width:0}
#shareView,#estimatorView,#editorView{min-width:0}
.editor-frame{display:block;width:100%;height:calc(100dvh - 108px);min-height:520px;border:1px solid var(--line);border-radius:10px}
.share-frame,.estimator-frame{display:block;width:100%;height:calc(100dvh - 116px);min-height:780px;border:1px solid var(--line);border-radius:10px}.share-frame{background:#0f172a}.estimator-frame{background:#f5f7fb;min-height:0;height:calc(100dvh - 108px)}
@media(max-width:600px){.page-tabs{width:100%;justify-content:space-between;flex-wrap:wrap}.page-tabs button{font-size:clamp(12px,3.7vw,16px);padding:6px clamp(7px,2.5vw,13px)}.share-frame,.estimator-frame{min-height:calc(100dvh - 130px)}}
</style>
</head>

<div class="wrap">

具体数字与走势为估算结果，不作为购买建议</textarea>

  <section class="panel">

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<script src="iso-sales-week.js"></script>
<script>
// ===== 配置：周列所属年份（ISO 周）。若列名写成 2026W34 这种格式，会自动识别年份 =====
const DEFAULT_YEAR=2026;
const DATA_URL="data.csv";

// ISO周计算的唯一实现位于 iso-sales-week.js，供网页和未来Node流水线共用。
const {isoWeekMonday,firstFullWeekMonday,lifecycleWeekIndex,partialWeek,utcDate}=IsoSalesWeek;
const fmtMD=t=>{const d=new Date(t);return (d.getUTCMonth()+1)+"/"+d.getUTCDate()};
let WEEKS=[],WMON=[],ROWS=[],BRANDS=[];

// 简单 CSV 解析（支持引号字段）
function parseCSV(text){
  const out=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(f);f=""}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);f="";if(row.some(x=>x.trim()!==""))out.push(row);row=[]}
    else f+=ch}
  row.push(f);if(row.some(x=>x.trim()!==""))out.push(row);
  return out;
}
// 自动识别 UTF-8 / GBK（Excel 中文版另存的 CSV 常为 GBK）
function decode(buf){
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){return new TextDecoder("gbk").decode(buf)}
}
function load(text){
  const t=parseCSV(text.replace(/^\uFEFF/,""));
  const head=t[0].map(h=>h.trim());
  const col=n=>head.indexOf(n);
  const ib=col("brand"),im=col("model"),ic=col("category"),id=col("date");
  if(ib<0||im<0||id<0)throw new Error("表头缺少 brand / model / date 列");
  const wIdx=[];head.forEach((h,i)=>{const m=h.match(/^(?:(\d{4})[-_ ]?)?W(\d{1,2})$/i);if(m)wIdx.push({i,y:m[1]?+m[1]:DEFAULT_YEAR,w:+m[2],name:h})});
  if(!wIdx.length)throw new Error("没有找到周列（列名应为 W34 或 2026W34 这种格式）");
  const weekCols=new Map();
  for(const x of wIdx){const m=isoWeekMonday(x.y,x.w);if(m==null||weekCols.has(m))throw new Error("存在无效或重复的ISO周列");weekCols.set(m,x);}
  const times=[...weekCols.keys()].sort((a,b)=>a-b),step=7*IsoSalesWeek.DAY;
  const ordered=[];for(let m=times[0];m<=times.at(-1);m+=step){
    const x=weekCols.get(m),y=new Date(m+3*IsoSalesWeek.DAY).getUTCFullYear(),w=1+Math.round((m-IsoSalesWeek.isoWeek1Monday(y))/step);
    ordered.push(x?{...x,m}:{i:-1,name:y+"W"+String(w).padStart(2,"0"),m});
  }
  WEEKS=ordered.map(x=>x.name.toUpperCase());WMON=ordered.map(x=>x.m);
  ROWS=t.slice(1).filter(c=>(c[ib]||"").trim()&&(c[im]||"").trim()).map(c=>{
    const dp=(c[id]||"").trim().split(/[\/\-.]/).map(Number);
    const ok=utcDate(dp)!=null;
    const w1m=ok?firstFullWeekMonday(dp):null;
    const p0=ok?partialWeek(dp):null;
    return {brand:c[ib].trim(),model:c[im].trim(),cat:ic>=0?(c[ic]||"").trim():"",date:(c[id]||"").trim(),
      vals:ordered.map(x=>{const v=(c[x.i]||"").trim().replace(/,/g,"");return v===""||!Number.isFinite(+v)?null:+v}),
      offs:WMON.map(m=>lifecycleWeekIndex(m,w1m)),
      p0:p0?{days:p0.days,isoMonday:p0.isoMonday}:null}});
  captureTempBase(t,ib,im,weekCols);
  assignColors();
  BRANDS=["全部",...new Set(ROWS.map(r=>r.brand))];
  if(!BRANDS.includes(S.brand))S.brand=BRANDS[1]||"全部";
  $("sub").textContent=`${WEEKS[0]}–${WEEKS[WEEKS.length-1]}（${fmtMD(WMON[0])} 起）· ${ROWS.length} 个机型 · 单位：万台`;
}
// ===== 颜色：按品牌分色系，同一色系的两个品牌色相略有偏移；同品牌内各机型变化明暗、饱和度和少量色相 =====
// 小米/REDMI 橙，华为/荣耀 红，OPPO/一加 绿，vivo/iQOO 蓝，苹果 紫；其他品牌用通用调色板
const BRAND_HUE={"小米":24,"redmi":38,"华为":2,"荣耀":344,"oppo":138,"一加":168,"vivo":214,"iqoo":234,"苹果":276};
// [色相偏移, 饱和度, 亮度]：相邻序号的亮度和色相尽量拉开
const SHADE=[[0,80,48],[-12,70,34],[12,78,62],[6,90,40],[-8,60,56],[14,65,30],[-14,85,66],[-4,55,44],[10,70,52],[-10,80,38]];
function hsl2hex(h,s,l){h=((h%360)+360)%360;s/=100;l/=100;const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,"0")};
  return "#"+f(0)+f(8)+f(4)}
function assignColors(){const n=new Map();let other=0;
  ROWS.forEach(r=>{const h=BRAND_HUE[r.brand]??BRAND_HUE[r.brand.toLowerCase()];
    if(h==null){r.cl=r.cd=PAL[other++%PAL.length];return}
    const k=n.get(r.brand)||0;n.set(r.brand,k+1);const [dh,sa,li]=SHADE[k%SHADE.length];

function buildTrackingCSV(){

  const header=csv[0].slice(),columns=new Map(weekCols);

  const editedWeeks=new Set([...tempEdits.values()].map(e=>e.m));
  const appended=[];
  WMON.forEach((m,i)=>{
    if(!columns.has(m)&&(m>tempBase.mondays.at(-1)||editedWeeks.has(m))){
      columns.set(m,header.length);header.push(WEEKS[i]);appended.push(m);
    }
  });
  const rows=csv.slice(1).map(source=>{
    const row=source.slice(),brand=(source[ib]||"").trim(),model=(source[im]||"").trim();
    // Keep source fields verbatim unless a user explicitly changed a value.
    if(appended.length){while(row.length<csv[0].length)row.push("");row.splice(csv[0].length,0,...appended.map(()=>""));}
    for(const m of editedWeeks){
      const edit=tempEdits.get(tempKey({brand,model},m));

  const text=[header,...rows].map(row=>row.map(quote).join(",")).join("\r\n")+"\r\n";

function historicalTrend(vals,left,window){
  const ds=[];

    const a=vals[i-1],b=vals[i];
    if(!isExact(a)||!isExact(b)||a<0||b<a)break;
    ds.unshift(b-a);
  }
  const count=ds.length;
  if(count<3||ds.filter(v=>v>0).length<3)return {count,method:"linear",reason:"断更前有效连续增量不足3个"};

  const ys=ds.map(v=>Math.log(Math.max(v,.01))),mean=ys.reduce((a,b)=>a+b,0)/count,mx=(count-1)/2;
  let xx=0,xy=0,yy=0;ys.forEach((v,i)=>{xx+=(i-mx)**2;xy+=(i-mx)*(v-mean);yy+=(v-mean)**2});
  const slope=xy/xx,r2=yy>0?xy*xy/(xx*yy):0;
  if(!Number.isFinite(slope)||r2<.2)return {count,method:"linear",reason:"历史趋势不明显",r2};
  const k=Math.max(-Math.log(1.25),Math.min(Math.log(1.25),slope));
  return {count,method:"fit",k,r2,limited:k!==slope};
}
function gapData(r){

  let left=-1;
  for(let right=0;right<vals.length;right++){
    if(!Number.isFinite(vals[right]))continue;
    // Recorded milestone thresholds are allowed at either end of an estimated interval.
    // Their difference is a reference scenario, not a measured increment.
    const rightVirtual=isVirtual(vals[right]),leftVirtual=left>=0&&isVirtual(vals[left]);
    const lowerBound=leftVirtual||rightVirtual;

      const n=right-left,total=vals[right]-vals[left],g={left,right,n,total,lowerBound,leftVirtual,rightVirtual,method:"raw",count:0};
      if(S.gap!=="raw"&&vals[left]>=0&&total>=0){
        const h=S.gap==="fit"?historicalTrend(vals,left,S.fitWindow):{method:"linear",count:0};Object.assign(g,h);

        const k=h.method==="fit"?h.k:0,shift=Math.max(0,k*(n-1)),weights=Array.from({length:n},(_,i)=>Math.exp(k*i-shift)),sum=weights.reduce((a,b)=>a+b,0);

      }else if(S.gap!=="raw")g.reason="累计下降或端点无效，不估算";
      gaps.push(g);

    left=right;

  syncRange(cats);
  const t=theme(),sel=selected(),datas=seriesData(sel,cats);
  setBrandMode(sel);
  const o={exp:false,mobile:isMobile(),W:chart.getWidth(),lo:S.from,hi:S.to};
  const base=sel.length&&sel.some(hasData)?[]:[{type:"text",left:"center",top:"middle",
      style:{text:sel.length?"所选机型暂无销量数据":"请在上方选择至少一个机型",fill:t.mu,fontSize:14}}];

function highlight(i){
  if(HL>=0)chart.dispatchAction({type:"downplay",seriesIndex:HL});

// ===== 导出 PNG：🖥️ 桌面 1200×675 @2x；📱 手机 400×500（4:5）@3x = 1200×1500 =====
async function exportPNG(mobile){
  if(!CUR||!CUR.sel.some(hasData)){alert("请先选择有数据的机型");return}
  const btn=$(mobile?"expMob":"expDesk"),prevM=MULTI;btn.disabled=true;
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const W=mobile?400:1200,H=mobile?500:675,dpr=mobile?3:2;
    const footer=exportFooter(W),imageHeight=H+footer.height;
    const lo=S.from,hi=S.to;
    const cats=CUR.cats.slice(lo,hi+1),datas=CUR.datas.map(d=>d.slice(lo,hi+1));
    const keep=CUR.sel.map((r,i)=>datas[i].some(v=>v!=null));
    const sel=CUR.sel.filter((r,i)=>keep[i]),ds=datas.filter((d,i)=>keep[i]);
    if(!sel.length){alert("当前周期范围内所选机型没有数据");return}
    setBrandMode(sel);
    const div=document.createElement("div");
    div.style.cssText=`position:fixed;left:-10000px;top:0;width:${W}px;height:${imageHeight}px`;
    document.body.appendChild(div);
    const inst=echarts.init(div,null,{renderer:"canvas",devicePixelRatio:dpr,width:W,height:imageHeight});
    const o={exp:true,mobile,W,H,footerHeight:footer.height,lo:0,hi:cats.length-1};
    inst.setOption(buildOption(sel,cats,ds,o));
    placeLabels(inst,{sel,datas:ds,o,base:[...(mobile?mobileList(o,theme()):[]),...footer.graphic]},0,cats.length-1);
    const url=inst.getDataURL({type:"png",pixelRatio:dpr,backgroundColor:theme().pn});
    inst.dispose();div.remove();
    const a=document.createElement("a");a.href=url;
    a.download=exportName(mobile);a.click();
  }finally{btn.disabled=false;MULTI=prevM}
}

function renderNote(sel){
  const msgs=[];
  if(S.list===MS_ID||S.list===CROSS_MS_ID){const on=new Set(sel.map(key)),list=S.list===MS_ID?MILE:CROSS_MILE;
    const ms=list.items.filter(x=>on.has(x.k)).map(x=>esc(milestoneText(x,true)));
    if(ms.length)msgs.push("🏁 "+ms.join("；"))}
  sel.forEach(r=>{let prev=-1;for(let i=0;i<r.vals.length;i++){const b=r.vals[i];if(b==null)continue;
    if(prev>=0&&isExact(b)&&b<r.vals[prev])msgs.push(`<b>${esc(label(r))}</b> 在 ${WEEKS[prev]} 至 ${WEEKS[i]} 由 ${r.vals[prev]} 降至 ${b}，疑似数据异常，不跨期估算`);prev=i}
    r.vals.forEach((v,i)=>{if(isVirtual(v))msgs.push(esc(label(r)+"："+WEEKS[i]+" 累计≥"+fmtV(v)+" 万台（虚拟里程碑下限，精确销量未知；可作左右参考估算端点）"));});

  });
  if(S.gap!=="raw")msgs.unshift("虚线与 ≈ 均为估算；里程碑可作左右参考端点，按记录数值之差分配，含虚拟左端点时差额也不是实际增量下限；不参与真实周增量选机");
  if(sel.some(r=>r.vals.some(isVirtual)))msgs.unshift("空心菱形及 ≥ 表示里程碑下限，不是精确值；手机列表按显示数值排序，不代表精确累计销量排名");

  $("note").innerHTML=(S.axis==="launch"?"「完整销售第 N 周」以所填日期起首个完整7天ISO自然周为W1；不足7天的上市当周P0不纳入W1起的图表，但会在表格单列P0天数与周末累计销量（非P0单周销量）。若填的是发布日期而非开售日，需核实日期口径。":"拖动图下方滑块或修改周期选择可调整显示范围。")+(msgs.length?" "+msgs.join("；")+"。":"");
}
function renderTable(sel){ // 列与图表横轴一致，但倒序：最新的周放在最左（紧跟发布日期列）

// ===== 里程碑合集（自动生成，不可编辑）：最新一周累计销量跨过 50 万台整数倍的机型 =====
// 「最新一周」按品牌取：该品牌数据更新到的最后一周（各品牌录入进度可能不同）
// 自动选择CSV最近12个ISO自然周内上市的新机；与真实当周的最新数据对齐，不以访问日期为准。
// 动态系统列表不写入localStorage，用户可勾选调整并通过“保存当前选择”保存快照。
const RECENT_WEEKS=12,RECENT_ID="__recent12";
let RECENT={id:RECENT_ID,name:"近12周新机",models:[],anchor:null};
function computeRecent(){
  let anchor=-1;
  ROWS.forEach(r=>r.vals.forEach((v,i)=>{if(v!=null)anchor=Math.max(anchor,i)}));
  if(anchor<0){RECENT={id:RECENT_ID,name:"近12周新机",models:[],anchor:null};return}
  const end=WMON[anchor],start=end-(RECENT_WEEKS-1)*IsoSalesWeek.DAY*7;
  const models=ROWS.filter(r=>hasData(r)&&(()=>{
    const d=r.date.split(/[\/\-.]/).map(Number),m=IsoSalesWeek.isoMonday(d);
    return m!=null&&m>=start&&m<=end;
  })()).map(key);
  RECENT={id:RECENT_ID,name:"近12周新机",models,anchor};
}
function recentButton(){
  const n=RECENT.models.length,week=RECENT.anchor==null?"尚无有效数据":WEEKS[RECENT.anchor];
  const tip="以最新数据周 "+week+" 为截止，自动包含该周及之前11个ISO周上市且有销量记录的机型。可通过机型选择器调整并保存为自定义列表。";
  return `<button class="ms" data-id="${RECENT_ID}" aria-pressed="${S.list===RECENT_ID}" title="${esc(tip)}"${n?"":" disabled"}>✨ ${RECENT.name}<span class="cnt">${n}</span></button>`;
}
const MS_ID="__milestone",CROSS_MS_ID="__crossMilestone";
let MILE={id:MS_ID,name:"本周里程碑",models:[],items:[]},CROSS_MILE={id:CROSS_MS_ID,name:"跨期里程碑",models:[],items:[]};
function computeMilestones(){
  const lastW=new Map();
  ROWS.forEach(r=>{for(let i=r.vals.length-1;i>=0;i--)if(r.vals[i]!=null){lastW.set(r.brand,Math.max(lastW.get(r.brand)??-1,i));break}});
  const weekly=[],cross=[];
  ROWS.forEach(r=>{const w=lastW.get(r.brand);if(w==null||r.vals[w]==null)return;
    let prev=w-1;while(prev>=0&&r.vals[prev]==null)prev--;
    const b=r.vals[w],virtual=isVirtual(b),kb=Math.floor(b/MS_STEP),prior=Math.max(0,...r.vals.slice(0,w).filter(Number.isFinite));
    if(prev<0&&!virtual)return;
    if(kb>Math.floor(prior/MS_STEP)){const adjacent=prev>=0&&w-prev===1&&isExact(r.vals[prev]);const item={k:key(r),r,m:kb*MS_STEP,w,prev,virtual,adjacent};(adjacent?weekly:cross).push(item);}
  });
  for(const [list,items] of [[MILE,weekly],[CROSS_MILE,cross]]){items.sort((x,y)=>y.m-x.m);list.items=items;list.models=items.map(x=>x.k);}
}
function milestoneText(x,short=false){
  const name=short?label(x.r):full(x.r);
  if(x.adjacent)return name+" 达到 "+x.m+" 万台（"+WEEKS[x.w]+(x.virtual?"，里程碑下限，精确值未知":"")+"）";
  if(x.prev<0||isVirtual(x.r.vals[x.prev]))return name+" 截至 "+WEEKS[x.w]+" 确认达到 "+x.m+" 万台（具体达成周未知"+(x.virtual?"，精确值未知":"")+"）";
  const gap=gapData(x.r).gaps.find(g=>g.left===x.prev&&g.right===x.w);
  let estimate="";
  if(gap&&gap.method!=="raw"&&!gap.lowerBound){const cum=gapData(x.r).cum;for(let i=x.prev+1;i<=x.w;i++)if(cum[i]>=x.m){estimate="；估计达成周 "+WEEKS[i]+"（"+gapLabel(gap)+"，非实际确认时间）";break}}
  return name+" 最新确认达到 "+x.m+" 万台（"+WEEKS[x.prev]+" 后至 "+WEEKS[x.w]+"，具体达成周未知"+(x.virtual?"，精确值未知":"")+estimate+"）";
}

const disclaimerInput=$("exportDisclaimer");
const disclaimerStorageKey="phoneSales.exportDisclaimer";
try{
  const savedDisclaimer=localStorage.getItem(disclaimerStorageKey);
  if(savedDisclaimer!==null)disclaimerInput.value=savedDisclaimer;
}catch(e){}
// 临时附注与正式附注分开存储；只在进入临时数据状态时自动添加提示。
const tempDisclaimerKey="phoneSales.module1.tempDisclaimer.v1";
const tempDisclaimerNotice="含本标签页临时数据，仅供参考";
let normalDisclaimer=disclaimerInput.value, tempDisclaimerActive=false;
function defaultTempDisclaimer(base){
  return base.split(/\r?\n/).some(line=>line.trim()===tempDisclaimerNotice)
    ?base:[base.trimEnd(),tempDisclaimerNotice].filter(Boolean).join("\n");
}
function syncTempDisclaimer(){
  const active=Boolean(tempEdits.size||tempEnd!=null);
  if(active===tempDisclaimerActive){
    if(!active)try{sessionStorage.removeItem(tempDisclaimerKey)}catch(e){}
    return;
  }
  if(active){
    normalDisclaimer=disclaimerInput.value;
    let saved=null;
    try{saved=sessionStorage.getItem(tempDisclaimerKey)}catch(e){}
    disclaimerInput.value=saved===null?defaultTempDisclaimer(normalDisclaimer):saved;
    tempDisclaimerActive=true;
    saveDisclaimer();
  }else{
    tempDisclaimerActive=false;
    disclaimerInput.value=normalDisclaimer;
    try{sessionStorage.removeItem(tempDisclaimerKey)}catch(e){}
  }
}
function saveDisclaimer(){
  if(tempDisclaimerActive){
    try{sessionStorage.setItem(tempDisclaimerKey,disclaimerInput.value)}catch(e){}
  }else{
    normalDisclaimer=disclaimerInput.value;
    try{localStorage.setItem(disclaimerStorageKey,normalDisclaimer)}catch(e){}
  }
}
disclaimerInput.addEventListener("input",saveDisclaimer);
$("resetExportDisclaimer").onclick=()=>{
  disclaimerInput.value=tempDisclaimerActive?defaultTempDisclaimer(disclaimerInput.defaultValue):disclaimerInput.defaultValue;
  saveDisclaimer();
};

<script>
/* 顶部四栏目：默认销量追踪；其余栏目支持 hash 深链接 */
(() => {
  const tabs = [
    {key: "sales", id: "tabSales", viewId: "salesView", hash: "#sales"},
    {key: "share", id: "tabShare", viewId: "shareView", hash: "#market-share"},
    {key: "estimator", id: "tabEstimator", viewId: "estimatorView", hash: "#sales-estimator"},
    {key: "editor", id: "tabEditor", viewId: "editorView", hash: "#sales-data-editor"}
  ].map(item => ({...item, tab: document.getElementById(item.id), view: document.getElementById(item.viewId)}));
  const salesView = document.getElementById("salesView");
  const shareView = document.getElementById("shareView");
  const shareFrame = document.getElementById("shareFrame");
  const estimatorFrame = document.getElementById("estimatorFrame");
  const editorFrame = document.getElementById("editorFrame");
  const sub = document.getElementById("sub");
  let frameObserver = null;
  function openStudio(key) {
    const frame = key === "share" ? shareFrame : estimatorFrame;
    frame.hidden = false;
    if (!frame.hasAttribute("src")) frame.src = frame.dataset.src;
    if (key === "share") requestAnimationFrame(resizeShareFrame);
  }

  function resizeShareFrame() {
    if (shareView.hidden || !shareFrame.hasAttribute("src")) return;
    try {
      const win = shareFrame.contentWindow;
      const doc = shareFrame.contentDocument;
      if (win && doc && win.innerWidth < 1024) {
        const aside = doc.querySelector("aside");
        const main = doc.querySelector("main");
        if (aside && main) {
          const height = Math.ceil(aside.getBoundingClientRect().height + main.getBoundingClientRect().height + 8);
          shareFrame.style.height = Math.max(900, height) + "px";
          return;
        }
      }
    } catch (_) { /* 独立文档不可读取时回退固定高度 */ }
    shareFrame.style.height = Math.max(780, window.innerHeight - 116) + "px";
  }

  function activate(key, updateUrl = false) {
    const active = tabs.find(t => t.key === key) || tabs[0];
    tabs.forEach(item => {
      const selected = item === active;
      item.view.hidden = !selected;
      item.tab.setAttribute("aria-selected", String(selected));
      item.tab.tabIndex = selected ? 0 : -1;
    });
    sub.hidden = active.key !== "sales";
    if (updateUrl && location.hash !== active.hash) history.pushState(null, "", active.hash);
    if (active.key === "share" || active.key === "estimator") {
      openStudio(active.key);
    } else if (active.key === "editor") {
      editorFrame.hidden = false;
      if (!editorFrame.hasAttribute("src")) editorFrame.src = editorFrame.dataset.src;
    } else {
      // ECharts 在隐藏后重新显示时需要重新测量宽度。
      requestAnimationFrame(() => window.dispatchEvent(new Event("resize")));
    }
  }

  function syncFromUrl() {
    const requested = tabs.find(t => t.hash === location.hash);
    activate(requested ? requested.key : "sales");
  }

  tabs.forEach((item, index) => {
    item.tab.addEventListener("click", () => activate(item.key, true));
    item.tab.addEventListener("keydown", event => {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      event.preventDefault();
      const nextIndex = event.key === "Home" ? 0
        : event.key === "End" ? tabs.length - 1
        : (index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
      tabs[nextIndex].tab.focus();
      activate(tabs[nextIndex].key, true);
    });
  });

  window.addEventListener("popstate", syncFromUrl);
  window.addEventListener("hashchange", syncFromUrl);
  window.addEventListener("resize", resizeShareFrame);
  shareFrame.addEventListener("load", () => {
    if (frameObserver) frameObserver.disconnect();
    try {
      const doc = shareFrame.contentDocument;
      const aside = doc.querySelector("aside");
      const main = doc.querySelector("main");
      if (aside && main && window.ResizeObserver) {
        frameObserver = new ResizeObserver(resizeShareFrame);
        frameObserver.observe(aside);
        frameObserver.observe(main);
      }
    } catch (_) { /* 页面无法读取时仍可显示 */ }
    resizeShareFrame();
  });
  syncFromUrl();
})();
</script>
