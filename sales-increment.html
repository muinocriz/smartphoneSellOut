<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="favicon-adaptive.svg">
<title>销量增量追踪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<script src="csv-utils.js"></script>
<script src="site-shell.js" data-page="sales-increment"></script>
<link rel="stylesheet" href="site-shell.css">
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#18243b;font:15px "Noto Sans SC",system-ui,sans-serif}main{max-width:980px;margin:auto;padding:32px 16px}h2{font-size:18px;margin:0 0 14px}small,p{color:#50617a}section{background:white;border:1px solid #dbe2ea;border-radius:14px;padding:20px;margin:16px 0}main label{display:inline-grid;gap:6px;margin:0 16px 8px 0}select{border:1px solid #aab7c9;border-radius:6px;background:white;padding:8px;font:inherit}#incrementChart{width:100%;height:auto;min-height:160px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{padding:8px 4px;text-align:right;border-bottom:1px solid #e4e8ef}td:first-child,th:first-child{text-align:left}caption{text-align:left;font-weight:bold;margin-bottom:10px}.scroll{overflow:auto}main details{margin:10px 0 18px}summary,button{cursor:pointer}button,input,textarea{font:inherit}button{padding:5px 9px}#choices{max-height:160px;overflow:auto;margin:8px 0}#choices label,#legend span{display:inline-flex;align-items:center;gap:5px;margin:3px 10px 3px 0}#legend{margin:8px 0}#legend i{width:12px;height:3px}label[hidden]{display:none}#footer{width:min(480px,78vw)}td[tabindex]{cursor:text} :root{--paper:#fff;--ink:#18243b;--sub:#50617a;--grid:#dee3ea;--active:#e3efff;color-scheme:light} :root[data-theme=dark]{--paper:#182231;--ink:#edf2fb;--sub:#c3cfe0;--grid:#425066;--active:#263f62;color-scheme:dark} :root[data-theme=dark] body{background:#101824;color:var(--ink)}section,select{background:var(--paper);color:var(--ink);border-color:var(--grid)}small,p{color:var(--sub)}td,th{border-color:var(--grid)}#matrix td,#matrix th{white-space:nowrap}#matrix tr>:first-child{position:sticky;left:0;background:var(--paper)}#legend button{background:var(--paper);color:var(--ink);border:1px solid var(--grid);border-radius:6px;margin:3px}#legend button[aria-pressed=true],td.changed{background:var(--active)}td.changed{box-shadow:inset 0 -2px #498bea}#hoverReadout{display:block;min-height:1.5em;color:var(--sub)}#incrementChart{touch-action:pan-y}#legend i{display:inline-block;vertical-align:middle;margin-right:5px}
.filter-row{display:flex;align-items:baseline;gap:12px;margin:10px 0}
.filter-row>span{flex:0 0 4em;color:var(--sub)}
.filter-options{display:flex;flex-wrap:wrap;min-width:0;max-width:100%}
.filter-options.brands{gap:6px}
.filter-options button{padding:5px 12px;color:var(--ink);background:var(--paper);border:1px solid var(--grid);white-space:nowrap}
.filter-options.brands button{border-radius:6px}
.filter-options.seg{border:1px solid var(--grid);border-radius:6px;overflow:hidden}
.filter-options.seg button{border:0;border-radius:0}
.filter-options button[aria-pressed="true"]{color:white;background:#1761ae;border-color:#1761ae}
.filter-options button:focus-visible{outline:2px solid currentColor;outline-offset:-3px}
:root {
  --control-bg: #fff;
  --control-border: #dce2ea;
  --control-accent: #315dcc;
}
:root[data-theme=dark] {
  --control-bg: #1b202b;
  --control-border: #343c4c;
  --control-accent: #92b0ff;
}
.source-actions,.comparison-actions,.list-actions,.export-actions,.footer-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.list-actions,.footer-actions { align-items: flex-end; }
.list-actions label,.footer-actions label { margin: 0; min-width: 0; max-width: 100%; }
.list-actions input,#footer { min-width: 0; max-width: 100%; }
#footer { resize: vertical; }

:where(.source-actions,.comparison-actions,.list-actions,.export-actions,.footer-actions,.edit-actions) > button,
#fullRange,
#importLists::file-selector-button {
  padding: 7px 12px;
  border: 1px solid var(--control-border);
  border-radius: 7px;
  background: var(--control-bg);
  color: var(--ink);
  font: inherit;
  line-height: 1.5;
  cursor: pointer;
  white-space: nowrap;
}
#importLists::file-selector-button { margin-inline-end: 8px; }
:where(.source-actions,.comparison-actions,.list-actions,.export-actions,.footer-actions,.edit-actions) > button:hover:not(:disabled),
#fullRange:hover,
#importLists::file-selector-button:hover { border-color: var(--control-accent); }
:where(.source-actions,.list-actions,.edit-actions) > button:disabled {
  opacity: .45;
  cursor: not-allowed;
}
:is(#listName,#milestoneStep,#footer) {
  padding: 7px 9px;
  border: 1px solid var(--control-border);
  border-radius: 6px;
  background: var(--control-bg);
  color: var(--ink);
  line-height: 1.5;
}
#listName::placeholder { color: var(--sub); }
:where(.source-actions,.comparison-actions,.list-actions,.export-actions,.footer-actions,.edit-actions) > button:focus-visible,
:is(#fullRange,#listName,#milestoneStep,#footer,#importLists):focus-visible {
  outline: 2px solid var(--control-accent);
  outline-offset: 1px;
}
.source-actions ~ #currentSource,.source-actions ~ #loadState,.source-actions ~ #editorImportStatus{margin:8px 0 0}
#chartControls{margin-top:12px}
.milestone-row{margin-top:12px}
.milestone-row input{width:12em;max-width:100%}
.range-controls,.edit-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.range-controls { margin-bottom: 8px; }
.edit-actions label { margin: 0; }
main label.inline-field:not([hidden]) {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 0;
  max-width: 100%;
  white-space: nowrap;
}
.inline-field select {
  min-width: 0;
  padding: 7px 12px;
  border-radius: 7px;
  background: var(--control-bg);
  border-color: var(--control-border);
  line-height: 1.5;
}
.inline-field input[type=checkbox] { width: 1em; height: 1em; margin: 0; }
.inline-field:has(input[type=checkbox]) { padding-inline: 4px; cursor: pointer; }
.inline-field,.inline-field select,#fullRange,.edit-actions:has(> .inline-field) > button { min-height: 40px; }
.edit-scroll{max-height:55vh}
#editGrid{border-collapse:separate;border-spacing:0}
#editGrid :is(th,td){white-space:nowrap}
#editGrid thead th{position:sticky;top:0;z-index:2;background:var(--paper)}
#editGrid tr>:first-child{position:sticky;left:0;z-index:1;background:var(--paper);text-align:left;padding-right:12px}
#editGrid thead tr>:first-child{z-index:3}
#editGrid input,#specialValue{width:8em}
#editGrid input,#editGrid button,#specialValue{padding:5px 8px;background:var(--paper);color:var(--ink);border:1px solid var(--grid);border-radius:6px}
#editGrid .cell-action{margin-left:4px;color:var(--sub)}
#editGrid .special-value{min-width:8em;color:var(--ink);background:var(--active)}
#specialEdit{max-width:calc(100% - 24px);background:var(--paper);color:var(--ink);border:1px solid var(--grid);border-radius:12px}
#specialEdit::backdrop{background:#0006}
</style>
</head>
<body>
<header class="site-header"></header>

<main>
<section>
<div class="source-actions">
  <button id="reloadProject" type="button">从项目导入</button>
  <button id="openLocalFile" type="button">从本地导入</button>
  <input id="localFile" type="file" accept=".csv,text/csv" hidden>
  <button id="importEditorDraft" type="button" disabled>从销量数据处理导入</button>
</div>
<p id="currentSource" hidden></p>
<p id="editorImportStatus" role="status"></p>
<p id="loadState" role="status">正在读取项目长表…</p>
<div id="chartControls" hidden>
<div class="filter-row"><span id="brand-label">品牌</span><div class="filter-options brands" id="brand" role="group" aria-labelledby="brand-label" data-value="">

</div></div>
<details open><summary>对比机型与列表</summary>
<div class="comparison-actions">
  <button id="all">全选当前品牌</button>
  <button id="brandTops">每品牌近期增量最高</button>
  <button id="none">清空对比</button>
</div>
<div id="choices"></div>
<div class="filter-row">
<span id="lists-label">机型列表</span>
<div id="lists" class="filter-options brands" role="group" aria-labelledby="lists-label"></div>
</div>
<div class="list-actions">
  <input id="listName" aria-label="列表名称" placeholder="列表名称">
  <button id="saveList">保存当前选择</button>
  <button id="deleteList" disabled>删除自建列表</button>
  <button id="exportLists">导出列表 JSON</button>
  <label>导入列表<input type="file" id="importLists" accept=".json"></label>
</div>
<div class="milestone-row">
  <label>里程碑间隔（万台）<input id="milestoneStep" type="number" min="1" max="9007199254740991" step="1" value="50"></label>
</div>
</details>
<div class="filter-row"><span id="metric-label">显示指标</span><div class="filter-options seg" id="metric" role="group" aria-labelledby="metric-label" data-value="cumulative">
<button type="button" data-value="cumulative" aria-pressed="true">累计销量</button>
<button type="button" data-value="weekly" aria-pressed="false">周销量增量</button>
</div></div>
<div class="filter-row"><span id="axis-label">横轴</span><div class="filter-options seg" id="axis" role="group" aria-labelledby="axis-label" data-value="iso">
<button type="button" data-value="iso" aria-pressed="true">自然周</button>
<button type="button" data-value="life" aria-pressed="false">完整销售第 N 周</button>
</div></div>
<div class="filter-row"><span id="gap-label">缺失周</span><div class="filter-options seg" id="gap" role="group" aria-labelledby="gap-label" data-value="raw">
<button type="button" data-value="raw" aria-pressed="true">仅原始观测</button>
<button type="button" data-value="linear" aria-pressed="false">线性插值</button>
<button type="button" data-value="fit" aria-pressed="false">历史趋势约束</button>
</div></div>
<div class="range-controls">
  <label class="inline-field" id="windowLabel" hidden>历史窗口<select id="window"><option>3</option><option>4</option><option selected>6</option><option>8</option></select></label>
  <label class="inline-field">起始周<select id="from"></select></label>
  <label class="inline-field">结束周<select id="to"></select></label>
  <button id="fullRange" type="button">全部周期</button>
  <label class="inline-field"><input type="checkbox" id="log">对数纵轴</label>
  <label class="inline-field"><input type="checkbox" id="labels" checked>数值标签</label>
</div>
<h2 id="heading">
</h2>
<svg id="incrementChart" viewBox="0 0 800 240" role="img" aria-labelledby="heading">
</svg>
<output id="hoverReadout" aria-live="off"></output>
<div id="legend"></div><small>● 精确值 · ○ 约数 · ↑ 至少达到该值 · ↓ 低于该值。虚线为区间估算。</small>
<p class="export-actions">
  <button id="desktopPNG">桌面 PNG</button>
  <button id="mobilePNG">手机 PNG</button>
</p>
<div class="footer-actions">
  <label>导出免责附注<textarea id="footer" rows="2">数据来源于微博等平台，仅供参考
具体数字与走势为估算结果，不作为购买建议</textarea></label>
  <button id="defaultFooter">恢复默认文案</button>
</div>
</div>
</section>
<div id="content" hidden>
<section class="scroll"><table id="matrix"><caption>所选机型对比（万台）</caption></table></section>
<section>
<h2>销量数据编辑 <small id="editCount"></small></h2>
<div class="edit-actions">
  <label class="inline-field">编辑指标<select id="editMetric"><option value="cumulative">累计销量</option><option value="weekly">直接周增量</option></select></label>
  <button type="button" id="addWeek">新增周次</button>
  <button type="button" id="undoEdit" disabled>撤销</button>
  <button type="button" id="reset">重置临时数据</button>
  <button type="button" id="download">导出长表 CSV</button>
</div>
<p>单位为万台。直接输入准确值，按 Enter 或离开输入框保存。清空输入可恢复原值。使用“特殊”录入约数或上下限，也可删除记录。</p>
<p id="editStatus" role="status"></p>
<div class="scroll edit-scroll"><table id="editGrid" aria-label="已选机型销量数据"></table></div>
<dialog id="specialEdit" aria-labelledby="specialTitle">
  <form id="specialForm">
    <h2 id="specialTitle">编辑销量记录</h2>
    <p id="specialContext"></p>
    <div class="edit-actions">
      <label>类型<select id="specialOp">
        <option value="≈">≈ 约等于</option>
        <option value="&gt;=">≥ 大于等于</option>
        <option value="&lt;">＜ 小于</option>
        <option value="=">＝ 准确值</option>
      </select></label>
      <label>销量（万台）<input id="specialValue" type="text" inputmode="decimal" required></label>
    </div>
    <p id="specialOriginal"></p>
    <div class="edit-actions">
      <button type="submit">保存</button>
      <button type="button" id="cancelSpecial">取消</button>
      <button type="button" id="restoreRecord">恢复原值</button>
      <button type="button" id="deleteRecord">删除记录</button>
    </div>
  </form>
</dialog>
</section>
</div>
</main>
<script src="iso-sales-week.js"></script>
<script src="sales-chart-layout.js"></script>
<script src="sales-increment.js"></script>
</body>
</html>
