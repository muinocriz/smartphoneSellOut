<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新机周销量追踪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 顶部标题 + 控制条（品牌 / 机型芯片 / 周期与显示选项）+ 全宽折线图 + 数据表 */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --fg:#1b2030; --muted:#636a7d; --line:#dfe2ea;
  --accent:#2f5bd3; --accent-soft:#e6ecfb; --warn:#b4541a;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --panel:#1a1e29; --fg:#e7e9ef; --muted:#9aa1b3; --line:#2c3242;
  --accent:#7f9cf0; --accent-soft:#25304d; --warn:#e89a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --panel:#1a1e29; --fg:#e7e9ef; --muted:#9aa1b3; --line:#2c3242;
  --accent:#7f9cf0; --accent-soft:#25304d; --warn:#e89a62; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:22px;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.hd-r{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.gh{font-size:13px;color:var(--accent);text-decoration:none;white-space:nowrap}
.gh:hover{text-decoration:underline}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.controls{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;min-width:3.5em}
select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.brands{display:flex;flex-wrap:wrap;gap:6px}
.brands button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;user-select:none;font-size:13px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--sw);background:transparent}
.chip.on{background:var(--accent-soft);border-color:transparent}
.chip.on .dot{background:var(--sw)}
.chip.empty{opacity:.5}
.chip:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.chip small{color:var(--muted);font-family:var(--f-num);font-size:11px}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.mini{font-size:12px;padding:3px 8px}
.lists{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0;align-items:center}
.lists button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.lists .cnt{font-family:var(--f-num);font-size:11px;opacity:.7;margin-left:4px}
.lists .hint{font-size:12px;color:var(--muted)}
.editor{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--accent-soft)}
.editor input[type=text]{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:12em;max-width:100%}
.editor .dirty{font-size:12px;color:var(--warn)}
.editor .ok{font-size:12px;color:var(--muted)}
button.danger{color:var(--warn);border-color:var(--warn)}
button.danger.arm{background:var(--warn);color:#fff}
#chart{width:100%;height:480px}
.note{font-size:12px;color:var(--muted)}
.note b{color:var(--warn);font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.na{color:var(--muted)}
td.bad{color:var(--warn)}
@media (max-width:600px){#chart{height:400px}}
.chart-head{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-bottom:4px}
.chart-head .note{margin-right:2px}
.ico{font-size:16px;line-height:1;padding:4px 8px}
.ico[disabled]{opacity:.5;cursor:progress}
.rank{list-style:none;margin:6px 0 4px;padding:0;display:grid;grid-auto-flow:column;gap:2px 14px}
.rank li{display:flex;align-items:center;gap:5px;min-width:0;font-size:13px;padding:3px 4px;border-radius:6px;cursor:pointer}
.rank li.on{background:var(--accent-soft)}
.rank b{color:var(--c);font-weight:700;min-width:1.4em}
.rank i{flex:none;width:14px;height:3px;border-radius:2px;background:var(--c)}
.rank span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank em{font-style:normal;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.load{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.load.err{color:var(--warn)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>新机周销量追踪</h1>
    <div class="hd-r">
      <span class="sub" id="sub">正在读取 data.csv…</span>
      <a class="gh" href="https://github.com/muinocriz/smartphoneSellOut" target="_blank" rel="noopener">GitHub 项目 ↗</a>
    </div>
  </header>
  <div class="load" id="load" hidden>
    <span id="loadMsg"></span>
    <label class="check"><input type="file" id="pick" accept=".csv,text/csv"> 手动选择 CSV</label>
  </div>

  <section class="panel controls" aria-label="筛选">
    <div class="row"><span class="lbl">品牌</span><div class="brands" id="brands"></div></div>
    <div class="row" style="align-items:flex-start">
      <span class="lbl" style="padding-top:4px">机型</span>
      <div class="chips" id="models"></div>
      <div style="display:flex;gap:6px"><button class="mini" id="selAll">全选</button><button class="mini" id="selNone">清空</button></div>
    </div>
    <div class="row" style="align-items:flex-start">
      <span class="lbl" style="padding-top:4px">我的列表</span>
      <div class="lists" id="lists"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="mini" id="listNew">＋ 保存当前选择</button>
        <button class="mini" id="listExport" title="导出全部列表为 JSON，用于备份或换设备">导出</button>
        <label class="mini" style="border:1px solid var(--line);border-radius:6px;cursor:pointer" title="从导出的 JSON 导入列表">导入<input type="file" id="listImport" accept=".json,application/json" hidden></label>
      </div>
    </div>
    <div class="editor" id="listEditor" hidden>
      <label for="listName" class="lbl" style="min-width:0">名称</label>
      <input type="text" id="listName" maxlength="30">
      <button class="mini" id="listUpdate">用当前选择更新</button>
      <button class="mini danger" id="listDelete">删除</button>
      <span id="listState"></span>
    </div>
    <div class="row">
      <span class="lbl">横轴</span>
      <div class="seg" id="axisMode">
        <button data-v="week" aria-pressed="true">自然周</button>
        <button data-v="launch" aria-pressed="false">发布后第 N 周</button>
      </div>
      <span class="lbl">周期</span>
      <select id="from" aria-label="起始周"></select><span class="note">至</span><select id="to" aria-label="结束周"></select>
      <button class="mini" id="resetRange">全部</button>
    </div>
    <div class="row">
      <span class="lbl">数值</span>
      <div class="seg" id="valMode">
        <button data-v="cum" aria-pressed="true">原始值</button>
        <button data-v="delta" aria-pressed="false">周环比增量</button>
      </div>
      <label class="check"><input type="checkbox" id="showLabel" checked> 显示数据标签</label>
      <label class="check"><input type="checkbox" id="logY"> 对数纵轴</label>
    </div>
  </section>

  <section class="panel">
    <div class="chart-head">
      <span class="note">导出 PNG</span>
      <button class="mini ico" id="expDesk" title="导出桌面端 PNG（16:9，2400×1350）" aria-label="导出桌面端 PNG">🖥️</button>
      <button class="mini ico" id="expMob" title="导出移动端 PNG（4:5 竖图，1200×1500，适合手机查看）" aria-label="导出移动端 PNG">📱</button>
    </div>
    <div id="chart" role="img" aria-label="所选机型周销量折线图"></div>
    <ol class="rank" id="rank" hidden aria-label="按最新值排序的机型列表"></ol>
    <p class="note" id="note"></p>
  </section>

  <section class="panel tbl"><table id="tbl"></table></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<script>
// ===== 配置：周列所属年份（ISO 周）。若列名写成 2026W34 这种格式，会自动识别年份 =====
const DEFAULT_YEAR=2026;
const DATA_URL="data.csv";

const DAY=864e5;
const isoW1Mon=y=>{const j4=Date.UTC(y,0,4);const dow=(new Date(j4).getUTCDay()+6)%7;return j4-dow*DAY};
const monOf=d=>{const t=Date.UTC(d[0],d[1]-1,d[2]);const dow=(new Date(t).getUTCDay()+6)%7;return t-dow*DAY};
const fmtMD=t=>{const d=new Date(t);return (d.getUTCMonth()+1)+"/"+d.getUTCDate()};
let WEEKS=[],WMON=[],ROWS=[],BRANDS=[];

// 简单 CSV 解析（支持引号字段）
function parseCSV(text){
  const out=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(f);f=""}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);f="";if(row.some(x=>x.trim()!==""))out.push(row);row=[]}
    else f+=ch}
  row.push(f);if(row.some(x=>x.trim()!==""))out.push(row);
  return out;
}
// 自动识别 UTF-8 / GBK（Excel 中文版另存的 CSV 常为 GBK）
function decode(buf){
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){return new TextDecoder("gbk").decode(buf)}
}
function load(text){
  const t=parseCSV(text.replace(/^\uFEFF/,""));
  const head=t[0].map(h=>h.trim());
  const col=n=>head.indexOf(n);
  const ib=col("brand"),im=col("model"),ic=col("category"),id=col("date");
  if(ib<0||im<0||id<0)throw new Error("表头缺少 brand / model / date 列");
  const wIdx=[];head.forEach((h,i)=>{const m=h.match(/^(?:(\d{4})[-_ ]?)?W(\d{1,2})$/i);if(m)wIdx.push({i,y:m[1]?+m[1]:DEFAULT_YEAR,w:+m[2],name:h})});
  if(!wIdx.length)throw new Error("没有找到周列（列名应为 W34 或 2026W34 这种格式）");
  WEEKS=wIdx.map(x=>x.name.toUpperCase());
  WMON=wIdx.map(x=>isoW1Mon(x.y)+(x.w-1)*7*DAY);
  ROWS=t.slice(1).filter(c=>(c[ib]||"").trim()&&(c[im]||"").trim()).map(c=>{
    const dp=(c[id]||"").trim().split(/[\/\-.]/).map(Number);
    const ok=dp.length===3&&dp.every(n=>!isNaN(n));
    const lm=ok?monOf(dp):null;
    return {brand:c[ib].trim(),model:c[im].trim(),cat:ic>=0?(c[ic]||"").trim():"",date:(c[id]||"").trim(),
      vals:wIdx.map(x=>{const v=(c[x.i]||"").trim().replace(/,/g,"");return v===""||isNaN(+v)?null:+v}),
      offs:WMON.map(m=>lm==null?null:Math.round((m-lm)/(7*DAY))+1)}});
  BRANDS=["全部",...new Set(ROWS.map(r=>r.brand))];
  if(!BRANDS.includes(S.brand))S.brand=BRANDS[1]||"全部";
  $("sub").textContent=`${WEEKS[0]}–${WEEKS[WEEKS.length-1]}（${fmtMD(WMON[0])} 起）· ${ROWS.length} 个机型 · 单位：万台`;
}
const PAL=["#2f6fde","#e0592a","#1c9a6c","#b4489f","#d29a00","#0f9bb0","#7a5ae0","#c23b4e","#5d8a1f","#8a6a4a","#3b4fa0","#d06d9c"];

const S={list:null,brand:"华为",sel:new Set(),axis:"week",val:"cum",label:!matchMedia("(max-width: 600px)").matches,log:false,from:null,to:null};
const $=id=>document.getElementById(id);
const chart=echarts.init($("chart"),null,{renderer:"canvas"});
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function rowsOfBrand(){return ROWS.filter(r=>S.brand==="全部"||r.brand===S.brand)}
function key(r){return r.brand+"|"+r.model}
// 图表/列表/表格中的名字：当前显示的机型都属于同一品牌时不写品牌，跨品牌时才写
let MULTI=false;
function setBrandMode(sel){MULTI=new Set(sel.map(r=>r.brand)).size>1}
function label(r){return MULTI?r.brand+" "+r.model:r.model}
// 机型选择芯片：「全部」视图下芯片来自多个品牌，始终写品牌
function chipLabel(r){return S.brand==="全部"?r.brand+" "+r.model:r.model}
function colorOf(r){return PAL[ROWS.indexOf(r)%PAL.length]}
function hasData(r){return r.vals.some(v=>v!=null)}
function series(r){ // 返回按周索引的数值
  if(S.val==="cum")return r.vals.slice();
  return r.vals.map((v,i)=>i===0||v==null||r.vals[i-1]==null?null:+(v-r.vals[i-1]).toFixed(2));
}

function renderBrands(){
  $("brands").innerHTML=BRANDS.map(b=>`<button aria-pressed="${b===S.brand}" data-b="${b}">${b}</button>`).join("");
}
function renderModels(){
  $("models").innerHTML=rowsOfBrand().map(r=>{const k=key(r),on=S.sel.has(k),e=!hasData(r);
    return `<label class="chip${on?" on":""}${e?" empty":""}" style="--sw:${colorOf(r)}" title="${r.cat} · 发布 ${r.date}${e?" · 暂无数据":""}">
      <input type="checkbox" data-k="${k}" ${on?"checked":""}><span class="dot"></span>${chipLabel(r)}<small>${r.date.slice(2)}</small></label>`}).join("");
}
function selected(){return rowsOfBrand().filter(r=>S.sel.has(key(r)))}

function categories(){
  if(S.axis==="week")return WEEKS.map((w,i)=>({k:i,t:w+"\n"+fmtMD(WMON[i])}));
  const sel=selected().filter(hasData);if(!sel.length)return [];
  let lo=Infinity,hi=-Infinity;
  sel.forEach(r=>r.vals.forEach((v,i)=>{if(v!=null&&r.offs[i]!=null){lo=Math.min(lo,r.offs[i]);hi=Math.max(hi,r.offs[i])}}));
  const out=[];for(let o=lo;o<=hi;o++)out.push({k:o,t:"第"+o+"周"});return out;
}
function syncRange(cats){
  const opts=cats.map((c,i)=>`<option value="${i}">${c.t.replace("\n"," ")}</option>`).join("");
  $("from").innerHTML=opts;$("to").innerHTML=opts;
  const n=cats.length;
  if(S.from==null||S.from>=n)S.from=0;
  if(S.to==null||S.to>=n)S.to=n-1;
  if(S.from>S.to)S.from=S.to;
  $("from").value=S.from;$("to").value=S.to;
}

// ===== 绘图：线尾直接标名（代替图例），屏幕与导出共用 =====
const FONT=()=>css("--f-body")||"sans-serif";
const MONO="IBM Plex Mono, monospace";
const theme=()=>({fg:css("--fg"),mu:css("--muted"),ln:css("--line"),pn:css("--panel")});
const fmtV=v=>(+v).toLocaleString("zh-CN",{maximumFractionDigits:2});
let MEAS=null;
function textW(t,size,weight,fam){MEAS=MEAS||document.createElement("canvas").getContext("2d");MEAS.font=`${weight||400} ${size}px ${fam||FONT()}`;return MEAS.measureText(t).width}
function fitText(t,max,size,weight){if(textW(t,size,weight)<=max)return t;
  while(t.length>1&&textW(t+"…",size,weight)>max)t=t.slice(0,-1);return t+"…"}
// 各尺寸参数：mobile 以 400px 宽设计、3 倍导出，所有文字 ≥12px
function spec(o){return o.mobile
  ?{ax:12,end:13,val:12,lw:2,lwH:3,sym:5,maxEnd:0.40}
  :{ax:11,end:12,val:11,lw:2,lwH:3,sym:o.exp?6:7,maxEnd:0.24}}
// 一个机型按当前横轴（自然周 / 发布后第 N 周）排列的数值，图和表格共用
function axisData(r,cats){const vs=series(r);
  if(S.axis==="week")return vs;
  const m=new Map();vs.forEach((v,i)=>{if(v!=null&&r.offs[i]!=null)m.set(r.offs[i],v)});
  return cats.map(c=>m.has(c.k)?m.get(c.k):null)}
function seriesData(sel,cats){
  return sel.map(r=>{const d=axisData(r,cats);
    return S.log?d.map(v=>v!=null&&v<=0?null:v):d})}
function lastIdx(d,lo,hi){for(let k=Math.min(hi,d.length-1);k>=lo;k--)if(d[k]!=null)return k;return -1}

// ===== 手机（网页与导出）：线尾只标序号，名字和数值放到图下方的排行列表 =====
// 按最新值从高到低编号，顺序与线尾的上下位置基本一致。
// 导出：最多 2 列 × 6 行，超出的不编号并注明数量；网页：单列、全部列出
const ML={row:21,rows:6,pad:16,gapTop:10};
function mobileRank(sel,datas,o){
  const items=sel.map((r,i)=>{const j=lastIdx(datas[i],o.lo,o.hi);return j<0?null:{i,r,v:datas[i][j]}}).filter(Boolean)
    .sort((a,b)=>b.v-a.v);
  const cols=o.exp&&items.length>4?2:1,cap=o.exp?cols*ML.rows:Infinity; // 网页上列表可滚动，全部列出
  let shown=items;if(items.length>cap)shown=items.slice(0,cap-1);
  o.rank=shown;o.more=items.length-shown.length;o.cols=cols;
  const rows=Math.ceil((shown.length+(o.more?1:0))/cols);
  o.listH=rows*ML.row+ML.gapTop;
  o.names=sel.map(()=>null);shown.forEach((it,k)=>{o.names[it.i]=String(k+1)});
}
// 列表名字：完整名（含品牌）放得下就完整显示；放不下先去掉品牌，仍放不下再截断
function listName(r,max){const full=label(r);
  return textW(full,13)<=max?full:fitText(r.model,max,13,400)}
function mobileList(o,t){
  const g=[],W=o.W,H=o.H,colW=(W-ML.pad*2)/o.cols,top=H-30-o.listH+ML.gapTop;
  const cells=o.rank.map((it,k)=>({k,it}));if(o.more)cells.push({more:o.more});
  const nW=textW(String(o.rank.length),13,700)+8,sw=14;
  const rows=Math.ceil(cells.length/o.cols);
  cells.forEach((c,n)=>{const col=Math.floor(n/rows),row=n%rows; // 先竖后横，阅读顺序 1→6 再 7→12
    const x=ML.pad+col*colW,y=top+row*ML.row+ML.row/2;
    if(c.more){g.push({type:"text",x,y,silent:true,style:{text:`另有 ${c.more} 个机型未列出`,fill:t.mu,font:`12px ${FONT()}`,textVerticalAlign:"middle"}});return}
    const {it,k}=c,num=String(k+1),vt=Math.round(it.v).toLocaleString("zh-CN"),col_=colorOf(it.r);
    const vW=textW(vt,12,400,MONO);
    g.push({type:"text",x,y,silent:true,style:{text:num,fill:col_,font:`700 13px ${FONT()}`,textVerticalAlign:"middle"}});
    g.push({type:"line",silent:true,shape:{x1:x+nW,y1:y,x2:x+nW+sw,y2:y},style:{stroke:col_,lineWidth:3,lineCap:"round"}});

  });

}

// 线尾标签避让：
// 1) 末点在最右侧的线，标签放在右侧栏，彼此上下推开（先下推、再收回绘图区），被推开的用引导线连回线尾；
// 2) 中途结束的线，在线尾周围试多个候选位置（右/右上/右下/上/下），按「与其他标签重叠、压到折线、超出绘图区」打分取最优；
//    都不理想且线尾靠近右侧时退回右侧栏 + 引导线；离得远就取得分最高的位置（标签自带底色，压线也可读）。
function stack(L,top,bottom,gap){
  L.sort((a,b)=>a.y0-b.y0);let prev=null;
  for(const l of L){l.y=Math.max(l.y0,prev?prev.y+(prev.h+l.h)/2+gap:-1e9);prev=l}
  let next=null;
  for(const l of [...L].reverse()){l.y=Math.min(l.y,next?next.y-(next.h+l.h)/2-gap:bottom-l.h/2);next=l}
  prev=null;for(const l of L){l.y=Math.max(l.y,top+l.h/2,prev?prev.y+(prev.h+l.h)/2+gap:-1e9);prev=l}
}
function segHitsBox(x1,y1,x2,y2,r){ // Liang–Barsky
  let t0=0,t1=1;const dx=x2-x1,dy=y2-y1;
  for(const [p,q] of [[-dx,x1-r.x0],[dx,r.x1-x1],[-dy,y1-r.y0],[dy,r.y1-y1]]){
    if(p===0){if(q<0)return false}else{const t=q/p;if(p<0){if(t>t1)return false;if(t>t0)t0=t}else{if(t<t0)return false;if(t<t1)t1=t}}}
  return true}
function boxOf(l,x,y){return {x0:x,x1:x+l.w,y0:y-l.h/2,y1:y+l.h/2}}
const boxHit=(a,b)=>a.x0<b.x1&&b.x0<a.x1&&a.y0<b.y1&&b.y0<a.y1;
function placeLabels(inst,ctx,lo,hi){
  const {sel,datas,o}=ctx,t=theme(),f=spec(o);
  let rect;try{rect=inst.getModel().getComponent("grid").coordinateSystem.getRect()}catch(e){rect={x:0,y:0,width:inst.getWidth(),height:inst.getHeight()}}
  const W=inst.getWidth(),right=rect.x+rect.width,top=rect.y,bottom=rect.y+rect.height,off=o.mobile?6:8;
  // 每条线在可见窗口内的折线（像素），用于避让
  const segs=[];
  sel.forEach((r,i)=>{const d=datas[i];let p=null;
    for(let k=lo;k<=Math.min(hi,d.length-1);k++){if(d[k]==null){p=null;continue}
      const q=inst.convertToPixel({seriesIndex:i},[k,d[k]]);if(p)segs.push({i,x1:p[0],y1:p[1],x2:q[0],y2:q[1]});p=q}});
  // 数据标签（数值）也作为障碍物
  const vbox=[];
  if(S.label&&!(o.mobile&&o.exp))sel.forEach((r,i)=>{const d=datas[i];
    for(let k=lo;k<=Math.min(hi,d.length-1);k++){if(d[k]==null)continue;
      const q=inst.convertToPixel({seriesIndex:i},[k,d[k]]),w=textW(fmtV(d[k]),f.val)+2,yb=q[1]-f.sym/2-5;
      vbox.push({x0:q[0]-w/2,x1:q[0]+w/2,y0:yb-f.val-2,y1:yb})}});
  const L=[];
  sel.forEach((r,i)=>{const d=datas[i],j=lastIdx(d,lo,hi);if(j<0||!o.names[i])return;
    const pt=inst.convertToPixel({seriesIndex:i},[j,d[j]]);if(!pt||!isFinite(pt[1]))return;
    const text=o.names[i];
    L.push({i,text,color:colorOf(r),px:pt[0],py:pt[1],y0:pt[1],w:textW(text,f.end,500)+8,h:f.end+6,
      atEnd:pt[0]>=right-2})});
  const gap=o.mobile?1:2;
  // 右侧栏容量：放不下时优先保留数值高（位置靠上）的线，其余不标
  const cap=Math.max(1,Math.floor((bottom-top+8+gap)/((L[0]?L[0].h:20)+gap)));
  let gut=L.filter(l=>l.atEnd).sort((a,b)=>a.py-b.py);
  gut.slice(cap).forEach(l=>l.skip=true);gut=gut.slice(0,cap);
  gut.forEach(l=>{l.x=Math.min(right+off,W-2-l.w)});
  stack(gut,top-4,bottom+4,gap);
  const placed=gut.map(l=>boxOf(l,l.x,l.y));
  const mid=L.filter(l=>!l.atEnd).sort((a,b)=>b.px-a.px);
  for(const l of mid){
    const {px,py,w,h}=l;
    const cands=[[px+off,py,0],[px+off,py-h*.75,1],[px+off,py+h*.75,1],[px-w/2,py-h/2-6,2],[px-w/2,py+h/2+6,2],
      [px+off,py-h*1.5,3],[px+off,py+h*1.5,3],[px-w-off,py,4],[px-w+off,py-h/2-6,5],[px-w+off,py+h/2+6,5],
      [px-w/2,py-h*1.6,6],[px-w/2,py+h*1.6,6]];
    let best=null;
    for(const [x,y,pen] of cands){
      const bx=boxOf(l,x,y);let sc=pen;
      if(bx.x0<2||bx.x1>W-2||bx.y0<top-4||bx.y1>bottom+4)sc+=1000;else if(bx.x0<rect.x)sc+=40; // 压到纵轴刻度区：轻罚
      for(const pb of placed)if(boxHit(bx,pb))sc+=500;
      for(const vb of vbox)if(boxHit(bx,vb))sc+=25;
      for(const sg of segs){if(sg.i===l.i)continue;if(segHitsBox(sg.x1,sg.y1,sg.x2,sg.y2,bx))sc+=60}
      for(const sg of segs){if(sg.i!==l.i)continue;if(segHitsBox(sg.x1,sg.y1,sg.x2,sg.y2,{x0:bx.x0+2,x1:bx.x1-2,y0:bx.y0+2,y1:bx.y1-2}))sc+=30}
      if(!best||sc<best.sc)best={x,y,sc}}
    if(best.sc>=60&&right-px<rect.width*.2&&gut.length<cap){ // 压线或重叠且离右侧不远：退到右侧栏
      l.x=Math.min(right+off,W-2-l.w);l.atEnd=true;gut.push(l);stack(gut,top-4,bottom+4,gap);
      placed.length=0;L.forEach(m=>{if(m.x!=null&&m.y!=null)placed.push(boxOf(m,m.x,m.y))});
    }else if(best.sc>=500){l.skip=true // 无处可放（超出或与其他标签重叠）：不标
    }else{l.x=best.x;l.y=best.y;placed.push(boxOf(l,l.x,l.y))}
  }
  const g=[];
  ctx.skipped=L.filter(l=>l.skip).length+sel.filter((r,i)=>lastIdx(datas[i],lo,hi)>=0&&!o.names[i]).length;
  // 放不下的名字不再隐藏：留在线尾原位，按重要性（数值从高到低）逐级变淡；悬停该线时完全显出
  // 导出的静态图无法悬停，淡色名字只会叠成一团，因此导出时不画；手机网页下方列表已列全，也不画
  const faint=o.exp||o.mobile?[]:L.filter(l=>l.skip).sort((a,b)=>a.py-b.py);
  L.splice(0,L.length,...L.filter(l=>!l.skip));
  L.forEach(l=>{l.op=1;
    const lead=l.atEnd?Math.abs(l.y-l.y0)>2||l.x-l.px>off+4:Math.hypot(l.x-l.px,l.y-l.py)>off+h2(l);
    l.lead=lead;
    if(lead){const tx=l.x<l.px?l.x+l.w:l.x;
      g.push({type:"polyline",id:"eg"+l.i,z:99,silent:true,
        shape:{points:l.atEnd?[[l.px+3,l.py],[l.x-4,l.y],[l.x,l.y]]:[[l.px,l.py],[tx,l.y]]},
        style:{stroke:l.color,lineWidth:1,opacity:.7,fill:null}})}
    g.push({type:"rect",id:"eb"+l.i,z:100,silent:true,shape:{x:l.x,y:l.y-l.h/2,width:l.w,height:l.h,r:3},
      style:{fill:t.pn,opacity:.88}});
    g.push({type:"text",id:"et"+l.i,z:101,x:l.x+4,y:l.y,cursor:"default",
      style:{text:l.text,fill:l.color,font:`${o.mobile?700:500} ${f.end}px ${FONT()}`,textVerticalAlign:"middle"},
      onmouseover:()=>inst.dispatchAction({type:"highlight",seriesIndex:l.i}),
      onmouseout:()=>inst.dispatchAction({type:"downplay",seriesIndex:l.i})});
  });
  faint.forEach((l,k)=>{
    l.op=Math.max(.12,.42-k*.03);l.faint=true;l.lead=false;
    l.x=Math.min(l.px+off,W-2-l.w);l.y=Math.max(top+l.h/2,Math.min(bottom-l.h/2,l.py));
    g.push({type:"rect",id:"eb"+l.i,z:102,silent:true,shape:{x:l.x,y:l.y-l.h/2,width:l.w,height:l.h,r:3},
      style:{fill:t.pn,opacity:0}});
    g.push({type:"text",id:"et"+l.i,z:103-k*.001,x:l.x+4,y:l.y,cursor:"default",
      style:{text:l.text,fill:l.color,opacity:l.op,font:`${f.end}px ${FONT()}`,textVerticalAlign:"middle"},
      onmouseover:()=>inst.dispatchAction({type:"highlight",seriesIndex:l.i}),
      onmouseout:()=>inst.dispatchAction({type:"downplay",seriesIndex:l.i})});
    L.push(l);
  });
  const base=[...(ctx.base||[])];
  if(o.exp)base.push({type:"text",left:o.mobile?16:20,bottom:o.mobile?12:14,silent:true,
    style:{text:"muinocriz.github.io/smartphoneSellOut",fill:t.mu,font:`12px ${FONT()}`}});
  ctx.labels=L;
  inst.setOption({graphic:[...base,...g]},{replaceMerge:["graphic"]});
}
const h2=l=>l.h*0.75+2;
// 悬停某条线时，其他线尾标签随之淡化
function fadeLabels(inst,ctx,idx){if(!ctx||!ctx.labels)return;
  inst.setOption({graphic:ctx.labels.flatMap(l=>{
    if(l.faint){const on=idx===l.i;
      return [{id:"et"+l.i,style:{opacity:on?1:idx<0?l.op:l.op*.4}},{id:"eb"+l.i,style:{opacity:on?.92:0}}]}
    const op=idx<0||idx===l.i?1:.25;
    return [{id:"et"+l.i,style:{opacity:op}},{id:"eb"+l.i,style:{opacity:op*.88}},...(l.lead?[{id:"eg"+l.i,style:{opacity:op*.7}}]:[])]})})}

let CUR=null;
function draw(keepRange){
  const cats=categories();
  if(!keepRange){S.from=0;S.to=Math.max(0,cats.length-1)}
  syncRange(cats);
  const t=theme(),sel=selected(),datas=seriesData(sel,cats);
  setBrandMode(sel);
  const o={exp:false,mobile:isMobile(),W:chart.getWidth(),lo:S.from,hi:S.to};
  const base=sel.length&&sel.some(hasData)?[]:[{type:"text",left:"center",top:"middle",
      style:{text:sel.length?"所选机型暂无销量数据":"请在上方选择至少一个机型",fill:t.mu,fontSize:14}}];
  chart.setOption(buildOption(sel,cats,datas,o),{replaceMerge:["series","graphic","title","tooltip","dataZoom"]});

  placeLabels(chart,CUR,S.from,S.to);

}

// ===== 导出 PNG：🖥️ 桌面 1200×675 @2x；📱 手机 400×500（4:5）@3x = 1200×1500 =====
async function exportPNG(mobile){
  if(!CUR||!CUR.sel.some(hasData)){alert("请先选择有数据的机型");return}
  const btn=$(mobile?"expMob":"expDesk"),prevM=MULTI;btn.disabled=true;
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const W=mobile?400:1200,H=mobile?500:675,dpr=mobile?3:2;
    const lo=S.from,hi=S.to;
    const cats=CUR.cats.slice(lo,hi+1),datas=CUR.datas.map(d=>d.slice(lo,hi+1));
    const keep=CUR.sel.map((r,i)=>datas[i].some(v=>v!=null));
    const sel=CUR.sel.filter((r,i)=>keep[i]),ds=datas.filter((d,i)=>keep[i]);
    if(!sel.length){alert("当前周期范围内所选机型没有数据");return}
    setBrandMode(sel);
    const div=document.createElement("div");
    div.style.cssText=`position:fixed;left:-10000px;top:0;width:${W}px;height:${H}px`;
    document.body.appendChild(div);
    const inst=echarts.init(div,null,{renderer:"canvas",devicePixelRatio:dpr,width:W,height:H});
    const o={exp:true,mobile,W,H,lo:0,hi:cats.length-1};
    inst.setOption(buildOption(sel,cats,ds,o));
    placeLabels(inst,{sel,datas:ds,o,base:mobile?mobileList(o,theme()):[]},0,cats.length-1);
    const url=inst.getDataURL({type:"png",pixelRatio:dpr,backgroundColor:theme().pn});
    inst.dispose();div.remove();
    const rg=cats.length?(cats[0].t.split("\n")[0]+"-"+cats[cats.length-1].t.split("\n")[0]):"";
    const a=document.createElement("a");a.href=url;
    const bs=[...new Set(sel.map(r=>r.brand))]; // 与图内副标题一致：同一品牌写品牌名，否则写「多品牌」
    a.download=`新机周销量_${bs.length===1?bs[0]:"多品牌"}_${rg}_${mobile?"手机":"桌面"}.png`;a.click();
  }finally{btn.disabled=false;MULTI=prevM}
}

function renderNote(sel){
  const msgs=[];
  sel.forEach(r=>{for(let i=1;i<r.vals.length;i++){const a=r.vals[i-1],b=r.vals[i];
    if(a!=null&&b!=null&&b<a)msgs.push(`<b>${label(r)}</b> 在 ${WEEKS[i]} 由 ${a} 降至 ${b}，疑似数据异常`)}});
  const empty=sel.filter(r=>!hasData(r)).map(label);
  if(empty.length)msgs.push(`${empty.join("、")} 暂无数据`);
  if(CUR&&CUR.skipped&&!CUR.o.mobile)msgs.push(`另有 ${CUR.skipped} 条线因空间不足，名字以淡色显示在线尾（越靠后越淡），悬停该线可看清`);
  if(S.axis==="launch"){const nod=sel.filter(r=>hasData(r)&&r.offs.every(o=>o==null)).map(label);
    if(nod.length)msgs.push(`<b>${nod.join("、")}</b> 未填写或无法识别发布日期，未在此视图显示`)}
  $("note").innerHTML=(S.axis==="launch"?"「发布后第 N 周」以发布日所在周为第 1 周，按 ISO 周对齐。":"拖动图下方滑块或修改周期选择可调整显示范围。")+(msgs.length?" "+msgs.join("；")+"。":"");
}
function renderTable(sel){ // 列与图表横轴一致

  const b=sel.map(r=>{const vs=axisData(r,cats);
    return `<tr><td><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colorOf(r)};margin-right:6px"></span>${label(r)}</td><td>${r.date}</td>${
      vs.map(v=>v==null?`<td class="na">—</td>`:`<td class="n${v<0?" bad":""}">${v.toFixed(2)}</td>`).join("")}</tr>`}).join("");
  $("tbl").innerHTML=`<thead>${h}</thead><tbody>${b}</tbody>`;
}

  S.list=null;renderBrands();renderModels();renderLists();draw(false)});
$("models").addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;
  e.target.checked?S.sel.add(k):S.sel.delete(k);e.target.closest(".chip").classList.toggle("on",e.target.checked);
  renderListState();draw(S.axis==="week")});
$("selAll").onclick=()=>{selectBrandAll();renderModels();renderListState();draw(S.axis==="week")};
$("selNone").onclick=()=>{S.sel.clear();renderModels();renderListState();draw(S.axis==="week")};

// ===== 用户自定义列表（保存在本浏览器 localStorage）=====
const LS_KEY="phoneSales.lists.v1";
let LISTS=[];
function loadLists(){try{const v=JSON.parse(localStorage.getItem(LS_KEY)||"[]");LISTS=Array.isArray(v)?v.filter(x=>x&&x.id&&Array.isArray(x.models)):[]}catch(e){LISTS=[]}}
function saveLists(){try{localStorage.setItem(LS_KEY,JSON.stringify(LISTS));return true}catch(e){$("listState").innerHTML='<span class="dirty">浏览器禁止存储，列表在关闭页面后会丢失</span>';return false}}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const curList=()=>LISTS.find(l=>l.id===S.list)||null;
const curKeys=()=>selected().map(key);
function nextName(){const used=new Set(LISTS.map(l=>l.name));let i=1;while(used.has("用户列表"+i))i++;return "用户列表"+i}
function sameSel(l){const a=new Set(curKeys());return a.size===l.models.length&&l.models.every(k=>a.has(k))}
function renderLists(){
  $("lists").innerHTML=LISTS.length?LISTS.map(l=>`<button aria-pressed="${l.id===S.list}" data-id="${l.id}" title="${esc(l.models.map(k=>k.replace("|"," ")).join("、"))}">${esc(l.name)}<span class="cnt">${l.models.length}</span></button>`).join("")
    :'<span class="hint">选好机型后点「保存当前选择」，下次打开可一键恢复</span>';
  const l=curList();$("listEditor").hidden=!l;
  if(l){if(document.activeElement!==$("listName"))$("listName").value=l.name;disarm();renderListState()}
}
function renderListState(){const l=curList();if(!l)return;
  const miss=l.models.filter(k=>!ROWS.some(r=>key(r)===k));
  let h=sameSel(l)?'<span class="ok">已保存</span>':'<span class="dirty">当前选择与列表不同，点「用当前选择更新」可保存修改</span>';
  if(miss.length)h+=` <span class="ok">（${miss.length} 个机型不在当前数据中：${esc(miss.map(k=>k.replace("|"," ")).join("、"))}）</span>`;
  $("listState").innerHTML=h}
function applyList(l){
  const exist=new Set(ROWS.map(key));const ks=l.models.filter(k=>exist.has(k));
  const brands=[...new Set(ks.map(k=>k.split("|")[0]))];
  S.brand=brands.length===1?brands[0]:"全部";S.sel=new Set(ks);S.list=l.id;
  renderBrands();renderModels();renderLists();draw(false)}
$("lists").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  const l=LISTS.find(x=>x.id===b.dataset.id);if(!l)return;
  if(S.list===l.id){S.list=null;renderLists();return}
  applyList(l)});
$("listNew").onclick=()=>{const ks=curKeys();
  if(!ks.length){$("listEditor").hidden=true;alert("请先选择至少一个机型");return}
  const l={id:"l"+Date.now().toString(36),name:nextName(),models:ks};
  LISTS.push(l);S.list=l.id;saveLists();renderLists();$("listName").focus();$("listName").select()};
$("listName").addEventListener("input",e=>{const l=curList();if(!l)return;
  l.name=e.target.value.trim()||l.name;saveLists();
  const b=$("lists").querySelector(`[data-id="${l.id}"]`);if(b)b.firstChild.textContent=l.name});
$("listName").addEventListener("blur",e=>{const l=curList();if(l)e.target.value=l.name});
$("listName").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});
$("listUpdate").onclick=()=>{const l=curList();if(!l)return;const ks=curKeys();
  if(!ks.length){$("listState").innerHTML='<span class="dirty">当前没有选中机型，无法更新</span>';return}
  l.models=ks;saveLists();renderLists()};
let armT=null;
function disarm(){clearTimeout(armT);$("listDelete").classList.remove("arm");$("listDelete").textContent="删除"}
$("listDelete").onclick=()=>{const b=$("listDelete");
  if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="确认删除？";armT=setTimeout(disarm,3000);return}
  LISTS=LISTS.filter(l=>l.id!==S.list);S.list=null;saveLists();renderLists()};
$("listExport").onclick=()=>{const blob=new Blob([JSON.stringify(LISTS,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="机型列表.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("listImport").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;
  try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw 0;let n=0;
    arr.forEach(x=>{if(!x||!Array.isArray(x.models)||!x.models.length)return;
      let name=String(x.name||"").trim()||nextName();if(LISTS.some(l=>l.name===name))name+="（导入）";
      LISTS.push({id:"l"+Date.now().toString(36)+(n++),name,models:x.models.map(String)})});
    saveLists();renderLists();alert(`已导入 ${n} 个列表`)}catch(_){alert("文件格式不正确，请选择本页面导出的 JSON")}
  e.target.value=""});
loadLists();renderLists();
function seg(id,prop){$(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  S[prop]=b.dataset.v;[...$(id).children].forEach(x=>x.setAttribute("aria-pressed",x===b));draw(prop==="val")})}
seg("axisMode","axis");seg("valMode","val");
$("showLabel").checked=S.label;
$("showLabel").onchange=e=>{S.label=e.target.checked;draw(true)};
$("logY").onchange=e=>{S.log=e.target.checked;draw(true)};
function applyRange(){chart.dispatchAction({type:"dataZoom",startValue:S.from,endValue:S.to})}
$("from").onchange=e=>{S.from=+e.target.value;if(S.from>S.to){S.to=S.from;$("to").value=S.to}applyRange()};
$("to").onchange=e=>{S.to=+e.target.value;if(S.to<S.from){S.from=S.to;$("from").value=S.from}applyRange()};
$("resetRange").onclick=()=>{S.from=0;S.to=$("to").options.length-1;$("from").value=S.from;$("to").value=S.to;applyRange()};
chart.on("datazoom",()=>{const dz=chart.getOption().dataZoom[0];S.from=dz.startValue;S.to=dz.endValue;$("from").value=S.from;$("to").value=S.to;
  if(CUR){if(CUR.o.mobile){CUR.o.lo=S.from;CUR.o.hi=S.to;mobileRank(CUR.sel,CUR.datas,CUR.o)}
    placeLabels(chart,CUR,S.from,S.to);renderRank();renderNote(CUR.sel)}});
$("rank").addEventListener("click",e=>{const li=e.target.closest("li");if(li)highlight(+li.dataset.i)});
MQ.addEventListener("change",()=>{chart.resize();draw(true)});
chart.on("mouseover",{componentType:"series"},p=>fadeLabels(chart,CUR,p.seriesIndex));
// 移开后回到列表里点选的那条线（若有），保持图和列表的高亮状态一致
chart.on("mouseout",{componentType:"series"},()=>{
  if(HL>=0)chart.dispatchAction({type:"highlight",seriesIndex:HL});
  fadeLabels(chart,CUR,HL)});
// 手机滚动时地址栏伸缩也会触发 resize（只改高度），此时不重画，避免图表反复闪动
let lastW=0;
window.addEventListener("resize",()=>{const w=$("chart").clientWidth;if(w===lastW)return;lastW=w;
  chart.resize();if(CUR)draw(true)});
$("expDesk").onclick=()=>exportPNG(false);
$("expMob").onclick=()=>exportPNG(true);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>draw(true));
new MutationObserver(()=>draw(true)).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

function start(text){
  try{load(text)}catch(e){showLoad("CSV 格式无法识别："+e.message,true);return}
  $("load").hidden=true;S.sel=new Set();selectBrandAll();renderBrands();renderModels();draw(false);
}
function showLoad(msg,err){$("load").hidden=false;$("load").classList.toggle("err",!!err);$("loadMsg").textContent=msg;$("sub").textContent="未加载数据"}
$("pick").addEventListener("change",async e=>{const f=e.target.files[0];if(f)start(decode(await f.arrayBuffer()))});
fetch(DATA_URL+"?t="+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()})
  .then(b=>start(decode(b)))
  .catch(()=>showLoad(location.protocol==="file:"?"直接双击打开时浏览器不允许读取本地 data.csv，请手动选择文件，或通过网页服务器访问。":"没有读取到同目录下的 data.csv，请检查文件名，或手动选择文件。",true));
</script>
</body>
