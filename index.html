<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新机周销量追踪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 顶部标题 + 控制条（品牌 / 机型芯片 / 周期与显示选项）+ 全宽折线图 + 数据表 */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --fg:#1b2030; --muted:#636a7d; --line:#dfe2ea;
  --accent:#2f5bd3; --accent-soft:#e6ecfb; --warn:#b4541a;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --panel:#1a1e29; --fg:#e7e9ef; --muted:#9aa1b3; --line:#2c3242;
  --accent:#7f9cf0; --accent-soft:#25304d; --warn:#e89a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --panel:#1a1e29; --fg:#e7e9ef; --muted:#9aa1b3; --line:#2c3242;
  --accent:#7f9cf0; --accent-soft:#25304d; --warn:#e89a62; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:22px;font-weight:700;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.controls{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;min-width:3.5em}
select,button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.brands{display:flex;flex-wrap:wrap;gap:6px}
.brands button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;user-select:none;font-size:13px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--sw);background:transparent}
.chip.on{background:var(--accent-soft);border-color:transparent}
.chip.on .dot{background:var(--sw)}
.chip.empty{opacity:.5}
.chip:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.chip small{color:var(--muted);font-family:var(--f-num);font-size:11px}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.mini{font-size:12px;padding:3px 8px}
#chart{width:100%;height:480px}
.note{font-size:12px;color:var(--muted)}
.note b{color:var(--warn);font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.na{color:var(--muted)}
td.bad{color:var(--warn)}
@media (max-width:600px){#chart{height:380px}}
.load{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.load.err{color:var(--warn)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>新机周销量追踪</h1>
    <span class="sub" id="sub">正在读取 data.csv…</span>
  </header>
  <div class="load" id="load" hidden>
    <span id="loadMsg"></span>
    <label class="check"><input type="file" id="pick" accept=".csv,text/csv"> 手动选择 CSV</label>
  </div>

  <section class="panel controls" aria-label="筛选">
    <div class="row"><span class="lbl">品牌</span><div class="brands" id="brands"></div></div>
    <div class="row" style="align-items:flex-start">
      <span class="lbl" style="padding-top:4px">机型</span>
      <div class="chips" id="models"></div>
      <div style="display:flex;gap:6px"><button class="mini" id="selAll">全选</button><button class="mini" id="selNone">清空</button></div>
    </div>
    <div class="row">
      <span class="lbl">横轴</span>
      <div class="seg" id="axisMode">
        <button data-v="week" aria-pressed="true">自然周</button>
        <button data-v="launch" aria-pressed="false">发布后第 N 周</button>
      </div>
      <span class="lbl">周期</span>
      <select id="from" aria-label="起始周"></select><span class="note">至</span><select id="to" aria-label="结束周"></select>
      <button class="mini" id="resetRange">全部</button>
    </div>
    <div class="row">
      <span class="lbl">数值</span>
      <div class="seg" id="valMode">
        <button data-v="cum" aria-pressed="true">原始值</button>
        <button data-v="delta" aria-pressed="false">周环比增量</button>
      </div>
      <label class="check"><input type="checkbox" id="showLabel" checked> 显示数据标签</label>
      <label class="check"><input type="checkbox" id="logY"> 对数纵轴</label>
    </div>
  </section>

  <section class="panel">
    <div id="chart" role="img" aria-label="所选机型周销量折线图"></div>
    <p class="note" id="note"></p>
  </section>

  <section class="panel tbl"><table id="tbl"></table></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
</body>
</html>
<script>
// ===== 配置：周列所属年份（ISO 周）。若列名写成 2026W34 这种格式，会自动识别年份 =====
const DEFAULT_YEAR=2026;
const DATA_URL="data.csv";

const DAY=864e5;
const isoW1Mon=y=>{const j4=Date.UTC(y,0,4);const dow=(new Date(j4).getUTCDay()+6)%7;return j4-dow*DAY};
const monOf=d=>{const t=Date.UTC(d[0],d[1]-1,d[2]);const dow=(new Date(t).getUTCDay()+6)%7;return t-dow*DAY};
const fmtMD=t=>{const d=new Date(t);return (d.getUTCMonth()+1)+"/"+d.getUTCDate()};
let WEEKS=[],WMON=[],ROWS=[],BRANDS=[];
const weekMonAt=i=>WMON[i];

// 简单 CSV 解析（支持引号字段）
function parseCSV(text){
  const out=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(f);f=""}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);f="";if(row.some(x=>x.trim()!==""))out.push(row);row=[]}
    else f+=ch}
  row.push(f);if(row.some(x=>x.trim()!==""))out.push(row);
  return out;
}
// 自动识别 UTF-8 / GBK（Excel 中文版另存的 CSV 常为 GBK）
function decode(buf){
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){return new TextDecoder("gbk").decode(buf)}
}
function load(text){
  const t=parseCSV(text.replace(/^\uFEFF/,""));
  const head=t[0].map(h=>h.trim());
  const col=n=>head.indexOf(n);
  const ib=col("brand"),im=col("model"),ic=col("category"),id=col("date");
  if(ib<0||im<0||id<0)throw new Error("表头缺少 brand / model / date 列");
  const wIdx=[];head.forEach((h,i)=>{const m=h.match(/^(?:(\d{4})[-_ ]?)?W(\d{1,2})$/i);if(m)wIdx.push({i,y:m[1]?+m[1]:DEFAULT_YEAR,w:+m[2],name:h})});
  if(!wIdx.length)throw new Error("没有找到周列（列名应为 W34 或 2026W34 这种格式）");
  WEEKS=wIdx.map(x=>x.name.toUpperCase());
  WMON=wIdx.map(x=>isoW1Mon(x.y)+(x.w-1)*7*DAY);
  ROWS=t.slice(1).filter(c=>(c[ib]||"").trim()&&(c[im]||"").trim()).map(c=>{
    const dp=(c[id]||"").trim().split(/[\/\-.]/).map(Number);
    const ok=dp.length===3&&dp.every(n=>!isNaN(n));
    const lm=ok?monOf(dp):null;
    return {brand:c[ib].trim(),model:c[im].trim(),cat:ic>=0?(c[ic]||"").trim():"",date:(c[id]||"").trim(),
      vals:wIdx.map(x=>{const v=(c[x.i]||"").trim().replace(/,/g,"");return v===""||isNaN(+v)?null:+v}),
      offs:WMON.map(m=>lm==null?null:Math.round((m-lm)/(7*DAY))+1)}});
  BRANDS=["全部",...new Set(ROWS.map(r=>r.brand))];
  if(!BRANDS.includes(S.brand))S.brand=BRANDS[1]||"全部";
  $("sub").textContent=`${WEEKS[0]}–${WEEKS[WEEKS.length-1]}（${fmtMD(WMON[0])} 起）· ${ROWS.length} 个机型 · 单位：万台`;
}
const PAL=["#2f6fde","#e0592a","#1c9a6c","#b4489f","#d29a00","#0f9bb0","#7a5ae0","#c23b4e","#5d8a1f","#8a6a4a","#3b4fa0","#d06d9c"];

const S={brand:"华为",sel:new Set(),axis:"week",val:"cum",label:true,log:false,from:null,to:null};
const $=id=>document.getElementById(id);
const chart=echarts.init($("chart"),null,{renderer:"canvas"});
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function rowsOfBrand(){return ROWS.filter(r=>S.brand==="全部"||r.brand===S.brand)}
function key(r){return r.brand+"|"+r.model}
function label(r){return S.brand==="全部"?r.brand+" "+r.model:r.model}
function colorOf(r){return PAL[ROWS.indexOf(r)%PAL.length]}
function hasData(r){return r.vals.some(v=>v!=null)}
function series(r){ // 返回按周索引的数值
  if(S.val==="cum")return r.vals.slice();
  return r.vals.map((v,i)=>i===0||v==null||r.vals[i-1]==null?null:+(v-r.vals[i-1]).toFixed(2));
}

function renderBrands(){
  $("brands").innerHTML=BRANDS.map(b=>`<button aria-pressed="${b===S.brand}" data-b="${b}">${b}</button>`).join("");
}
function renderModels(){
  $("models").innerHTML=rowsOfBrand().map(r=>{const k=key(r),on=S.sel.has(k),e=!hasData(r);
    return `<label class="chip${on?" on":""}${e?" empty":""}" style="--sw:${colorOf(r)}" title="${r.cat} · 发布 ${r.date}${e?" · 暂无数据":""}">
      <input type="checkbox" data-k="${k}" ${on?"checked":""}><span class="dot"></span>${label(r)}<small>${r.date.slice(2)}</small></label>`}).join("");
}
function selected(){return rowsOfBrand().filter(r=>S.sel.has(key(r)))}

function categories(){
  if(S.axis==="week")return WEEKS.map((w,i)=>({k:i,t:w+"\n"+fmtMD(WMON[i])}));
  const sel=selected().filter(hasData);if(!sel.length)return [];
  let lo=Infinity,hi=-Infinity;
  sel.forEach(r=>r.vals.forEach((v,i)=>{if(v!=null&&r.offs[i]!=null){lo=Math.min(lo,r.offs[i]);hi=Math.max(hi,r.offs[i])}}));
  const out=[];for(let o=lo;o<=hi;o++)out.push({k:o,t:"第"+o+"周"});return out;
}
function syncRange(cats){
  const opts=cats.map((c,i)=>`<option value="${i}">${c.t.replace("\n"," ")}</option>`).join("");
  $("from").innerHTML=opts;$("to").innerHTML=opts;
  const n=cats.length;
  if(S.from==null||S.from>=n)S.from=0;
  if(S.to==null||S.to>=n)S.to=n-1;
  if(S.from>S.to)S.from=S.to;
  $("from").value=S.from;$("to").value=S.to;
}

function draw(keepRange){
  const cats=categories();
  if(!keepRange){S.from=0;S.to=Math.max(0,cats.length-1)}
  syncRange(cats);
  const fg=css("--fg"),mu=css("--muted"),ln=css("--line"),pn=css("--panel");
  const sel=selected();
  const ser=sel.map(r=>{
    const vs=series(r);
    let data;
    if(S.axis==="week")data=vs;
    else{const m=new Map();vs.forEach((v,i)=>{if(v!=null&&r.offs[i]!=null)m.set(r.offs[i],v)});data=cats.map(c=>m.has(c.k)?m.get(c.k):null)}
    if(S.log)data=data.map(v=>v!=null&&v<=0?null:v);
    return {name:label(r),type:"line",data,connectNulls:false,smooth:false,symbol:"circle",symbolSize:7,
      lineStyle:{width:2.2,color:colorOf(r)},itemStyle:{color:colorOf(r),borderColor:pn,borderWidth:1.5},
      label:{show:S.label,position:"top",fontSize:11,color:fg,fontFamily:"IBM Plex Mono, monospace",
        formatter:p=>p.value==null?"":(+p.value).toLocaleString("zh-CN",{maximumFractionDigits:2}),
        textBorderColor:pn,textBorderWidth:2},
      labelLayout:{hideOverlap:true},emphasis:{focus:"series"}};
  });
  chart.setOption({
    animationDuration:400,
    grid:{left:56,right:24,top:sel.length>6?84:56,bottom:84,containLabel:false},
    legend:{type:"scroll",top:0,textStyle:{color:fg},pageTextStyle:{color:mu},inactiveColor:ln},
    tooltip:{trigger:"axis",backgroundColor:pn,borderColor:ln,textStyle:{color:fg},
      valueFormatter:v=>v==null?"—":(+v).toFixed(2)+" 万台"},
    xAxis:{type:"category",data:cats.map(c=>c.t),boundaryGap:false,
      axisLine:{lineStyle:{color:ln}},axisLabel:{color:mu,fontSize:11},axisTick:{show:false}},
    yAxis:{type:S.log?"log":"value",name:S.val==="cum"?"万台":"周增量（万台）",nameTextStyle:{color:mu},
      scale:!S.log,axisLabel:{color:mu,fontFamily:"IBM Plex Mono, monospace"},splitLine:{lineStyle:{color:ln,type:"dashed"}}},
    dataZoom:[{type:"slider",xAxisIndex:0,startValue:S.from,endValue:S.to,bottom:14,height:22,
        borderColor:ln,fillerColor:"rgba(100,130,220,.18)",textStyle:{color:mu},brushSelect:false,
        dataBackground:{lineStyle:{color:ln},areaStyle:{color:ln}}},
      {type:"inside",xAxisIndex:0,startValue:S.from,endValue:S.to}],
    series:ser,
    graphic:sel.length&&sel.some(hasData)?[]:[{type:"text",left:"center",top:"middle",
      style:{text:sel.length?"所选机型暂无销量数据":"请在上方选择至少一个机型",fill:mu,fontSize:14}}]
  },{replaceMerge:["series","graphic"]});
  renderNote(sel);renderTable(sel);
}

function renderNote(sel){
  const msgs=[];
  sel.forEach(r=>{for(let i=1;i<r.vals.length;i++){const a=r.vals[i-1],b=r.vals[i];
    if(a!=null&&b!=null&&b<a)msgs.push(`<b>${label(r)}</b> 在 ${WEEKS[i]} 由 ${a} 降至 ${b}，疑似数据异常`)}});
  const empty=sel.filter(r=>!hasData(r)).map(label);
  if(empty.length)msgs.push(`${empty.join("、")} 暂无数据`);
  $("note").innerHTML=(S.axis==="launch"?"「发布后第 N 周」以发布日所在周为第 1 周，按 ISO 周对齐。":"拖动图下方滑块或修改周期选择可调整显示范围。")+(msgs.length?" "+msgs.join("；")+"。":"");
}
function renderTable(sel){
  if(!sel.length){$("tbl").innerHTML="";return}
  const h=`<tr><th>机型</th><th>发布日期</th>${WEEKS.map(w=>`<th>${w}</th>`).join("")}</tr>`;
  const b=sel.map(r=>{const vs=series(r);
    return `<tr><td><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colorOf(r)};margin-right:6px"></span>${label(r)}</td><td>${r.date}</td>${
      vs.map(v=>v==null?`<td class="na">—</td>`:`<td class="n${v<0?" bad":""}">${v.toFixed(2)}</td>`).join("")}</tr>`}).join("");
  $("tbl").innerHTML=`<thead>${h}</thead><tbody>${b}</tbody>`;
}

function selectBrandAll(){S.sel=new Set(rowsOfBrand().filter(hasData).map(key))}

$("brands").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  S.brand=b.dataset.b;
  if(S.brand==="全部"){S.sel=new Set(ROWS.filter(r=>hasData(r)&&(r.cat.startsWith("旗舰"))&&r.vals[r.vals.length-1]!=null).slice(0,6).map(key))}
  else selectBrandAll();
  renderBrands();renderModels();draw(false)});
$("models").addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;
  e.target.checked?S.sel.add(k):S.sel.delete(k);e.target.closest(".chip").classList.toggle("on",e.target.checked);
  draw(S.axis==="week")});
$("selAll").onclick=()=>{selectBrandAll();renderModels();draw(S.axis==="week")};
$("selNone").onclick=()=>{S.sel.clear();renderModels();draw(S.axis==="week")};
function seg(id,prop){$(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  S[prop]=b.dataset.v;[...$(id).children].forEach(x=>x.setAttribute("aria-pressed",x===b));draw(prop==="val")})}
seg("axisMode","axis");seg("valMode","val");
$("showLabel").onchange=e=>{S.label=e.target.checked;draw(true)};
$("logY").onchange=e=>{S.log=e.target.checked;draw(true)};
function applyRange(){chart.dispatchAction({type:"dataZoom",startValue:S.from,endValue:S.to})}
$("from").onchange=e=>{S.from=+e.target.value;if(S.from>S.to){S.to=S.from;$("to").value=S.to}applyRange()};
$("to").onchange=e=>{S.to=+e.target.value;if(S.to<S.from){S.from=S.to;$("from").value=S.from}applyRange()};
$("resetRange").onclick=()=>{S.from=0;S.to=$("to").options.length-1;$("from").value=S.from;$("to").value=S.to;applyRange()};
chart.on("datazoom",()=>{const dz=chart.getOption().dataZoom[0];S.from=dz.startValue;S.to=dz.endValue;$("from").value=S.from;$("to").value=S.to});
window.addEventListener("resize",()=>chart.resize());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>draw(true));
new MutationObserver(()=>draw(true)).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

function start(text){
  try{load(text)}catch(e){showLoad("CSV 格式无法识别："+e.message,true);return}
  $("load").hidden=true;S.sel=new Set();selectBrandAll();renderBrands();renderModels();draw(false);
}
function showLoad(msg,err){$("load").hidden=false;$("load").classList.toggle("err",!!err);$("loadMsg").textContent=msg;$("sub").textContent="未加载数据"}
$("pick").addEventListener("change",async e=>{const f=e.target.files[0];if(f)start(decode(await f.arrayBuffer()))});
fetch(DATA_URL+"?t="+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()})
  .then(b=>start(decode(b)))
  .catch(()=>showLoad(location.protocol==="file:"?"直接双击打开时浏览器不允许读取本地 data.csv，请手动选择文件，或通过网页服务器访问。":"没有读取到同目录下的 data.csv，请检查文件名，或手动选择文件。",true));
</script>
</body>
</html>
