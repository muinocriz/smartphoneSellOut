<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>销量增量追踪</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#18243b;font:15px "Noto Sans SC",system-ui,sans-serif}main{max-width:980px;margin:auto;padding:32px 16px}h1{font-size:clamp(24px,5vw,38px);margin:4px 0}h2{font-size:18px;margin:0 0 14px}small,p{color:#50617a}section{background:white;border:1px solid #dbe2ea;border-radius:14px;padding:20px;margin:16px 0}label{display:inline-grid;gap:6px;margin:0 16px 8px 0}select{border:1px solid #aab7c9;border-radius:6px;background:white;padding:8px;font:inherit}svg{width:100%;height:auto;min-height:160px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{padding:8px 4px;text-align:right;border-bottom:1px solid #e4e8ef}td:first-child,th:first-child{text-align:left}caption{text-align:left;font-weight:bold;margin-bottom:10px}.scroll{overflow:auto}details{margin:10px 0 18px}summary,button{cursor:pointer}button,input,textarea{font:inherit}button{padding:5px 9px}#choices{max-height:160px;overflow:auto;margin:8px 0}#choices label,#legend span{display:inline-flex;align-items:center;gap:5px;margin:3px 10px 3px 0}#legend{margin:8px 0}#legend i{width:12px;height:3px}label[hidden]{display:none}#footer{width:min(480px,78vw)}td[tabindex]{cursor:text}</style>
<main>
<h1>销量增量追踪</h1>
<p>精选机型 · 单位：万台</p>
<label>导入本地销量长表<input id="localFile" type="file" accept=".csv,text/csv"></label>
<p id="loadState" role="status">正在读取项目长表…</p>
<div id="content" hidden>
<section>
<label>明细与编辑对象<select id="model">
</select>
</label>
<label>显示指标<select id="metric">
<option value="weekly">周销量增量</option>
<option value="cumulative">累计销量</option>
</select>
</label>
<details><summary>对比机型与列表</summary>
<label>品牌<select id="brand"></select></label>
<button id="all">全选当前品牌</button> <button id="brandTops">每品牌近期增量最高</button> <button id="none">清空对比</button>
<div id="choices"></div>
<label>机型列表<select id="lists"></select></label><button id="applyList">应用</button>
<input id="listName" aria-label="列表名称" placeholder="列表名称"><button id="saveList">保存当前选择</button> <button id="deleteList">删除自建列表</button>
<button id="exportLists">导出列表 JSON</button><label>导入列表<input type="file" id="importLists" accept=".json"></label>
</details>
<label>横轴<select id="axis"><option value="iso">自然周</option><option value="life">完整销售第 N 周</option></select></label>
<label>缺失周<select id="gap"><option value="raw">仅原始观测</option><option value="linear">线性插值</option><option value="fit">历史趋势约束</option></select></label>
<label id="windowLabel" hidden>历史窗口<select id="window"><option>3</option><option>4</option><option selected>6</option><option>8</option></select></label>
<label>起始周<select id="from"></select></label><label>结束周<select id="to"></select></label>
<label><input type="checkbox" id="log">对数纵轴</label><label><input type="checkbox" id="labels">数值标签</label>
<h2 id="heading">
</h2>
<svg viewBox="0 0 800 240" role="img" aria-labelledby="heading">
</svg>
<div id="legend"></div><small>虚线为区间估算。○↑ 表示至少达到该值，○↓ 表示低于该值，≈ 表示约数。</small>
<p><button id="desktopPNG">桌面 PNG</button> <button id="mobilePNG">手机 PNG</button></p><label>导出免责附注<textarea id="footer" rows="2">数据来源于微博等平台，仅供参考
具体数字与走势为估算结果，不作为购买建议</textarea></label> <button id="defaultFooter">恢复默认文案</button>
</section>
<section class="scroll">
<table>
<caption id="detailTitle">逐周明细</caption>
<thead>
<tr>
<th>ISO 周</th>
<th>完整销售周</th><th>累计销量</th>
<th>周销量增量</th>
<th>增量来源</th>
</tr>
</thead>
<tbody>
</tbody>
</table>
</section>
<section>
<h2>销量数据编辑</h2>
<p>双击数值格或选中后按 Enter 编辑。空白表示没有原始记录。</p>
<p id="editStatus" role="status"></p><button id="addWeek">新增周次</button> <button id="reset">重置临时数据</button> <button id="download">导出长表 CSV</button>
<div class="scroll">
<table id="editGrid">
</table>
</div>
</section>
</div>
</main>
<script src="iso-sales-week.js"></script>
<script src="sales-increment.js"></script>
</html>
