name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SALES_D1_ORIGIN: ${{ vars.SALES_D1_ORIGIN || 'https://smartphonesellout.zirconium.workers.dev' }}
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A later run also picks up CSV edits from earlier queued builds.
          ref: ${{ github.ref == 'refs/heads/master' && 'master' || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Synchronize changed GitHub CSVs to D1
        if: github.ref == 'refs/heads/master'
        env:
          D1_SYNC_TOKEN: ${{ secrets.D1_SYNC_TOKEN }}
          CLOUDFLARE_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_EMAIL_FROM: ${{ secrets.SYNC_EMAIL_FROM }}
          SYNC_EMAIL_TO: ${{ secrets.SYNC_EMAIL_TO }}
        run: |
          if [ -z "$D1_SYNC_TOKEN" ]; then
            echo "::notice::D1 CSV synchronization is inactive until D1_SYNC_TOKEN is configured."
          else
            node scripts/sync-github-csv.mjs
          fi
      - uses: actions/configure-pages@v5
      - name: Download a consistent D1 snapshot
        env:
          SALES_SNAPSHOT_DIR: ${{ runner.temp }}/sales-d1-snapshot-${{ github.run_attempt }}
        run: |
          # Cloudflare and GitHub may start deploying the same commit in parallel.
          for attempt in 1 2 3 4 5 6; do
            if npm run snapshot:d1 -- "$SALES_D1_ORIGIN" "$SALES_SNAPSHOT_DIR"; then
              echo "SALES_SNAPSHOT_DIR=$SALES_SNAPSHOT_DIR" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$attempt" = 6 ]; then
              exit 1
            fi
            sleep 20
          done
      - run: npm run build
      - name: Archive the data snapshot
        uses: actions/upload-artifact@v4
        with:
          name: d1-snapshot-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sales-d1-snapshot-${{ github.run_attempt }}
          if-no-files-found: error
      - name: Set Pages artifact name
        id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
